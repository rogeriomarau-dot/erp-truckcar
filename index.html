  if(!F.orcEd){ F.orcEd=orcNovoObj(); F.orcSalvo=''; }
  const O=F.orcEd, trav=O.status==='aprovado', dis=trav?' disabled':'', e=S.cfg.empresa||{};
  const inp=(id,val,extra)=>`<input id="${id}" value="${esc(val??'')}" data-inp="oqIn" ${extra||''}${dis}>`;
  const setor=s=>{ const x=O.setores[s.k]; return `<section class="card oq-setor" aria-label="${s.nome}">
    <div class="oq-setor-h"><h2>${s.nome}</h2></div>
    <div class="oq-lin"><div class="f"><label>Hora</label></div><div class="f"><label for="oq_${s.k}_hora">Valor (R$)</label>${inp('oq_'+s.k+'_hora',fmoneyIn(x.hora),'class="n" inputmode="decimal"')}</div><div class="f"><label for="oq_${s.k}_qt">Horas</label>${inp('oq_'+s.k+'_qt',fnum(x.qt,2),'class="n" inputmode="decimal"')}</div>
      <div class="oq-tot"><span>Mão de obra</span><b id="oq_${s.k}_mo">—</b></div></div>
    <div class="oq-lin"><div class="f"><label>Material</label></div><div class="f" style="grid-column:span 2"><label for="oq_${s.k}_mat">Valor do material (R$)</label>${inp('oq_'+s.k+'_mat',fmoneyIn(x.mat),'class="n" inputmode="decimal"')}</div></div>
    <div class="oq-sub"><span>Total (custo)</span><b id="oq_${s.k}_custo">—</b></div>
    <div class="oq-mult"><label for="oq_${s.k}_mult">Multiplicador</label>${inp('oq_'+s.k+'_mult',fnum(x.mult,2),'class="n" inputmode="decimal"')}</div>
    <div class="oq-preco"><small>Preço ${s.nome}</small><b id="oq_${s.k}_preco">—</b></div></section>`; };
  const st=O.status||'aberto', salvo=!!O.id;
  return `<div class="oq">
  <header class="oq-top">
    <div class="oq-marca"><div class="oq-lg"><img src="${S.logo||LOGO}" alt="${esc(e.nome||'Truckcar')}"></div>
      <div><h1>Orçamento de serviço</h1><div class="oq-subh">${esc([(e.nome||'Truckcar Centro Automotivo').replace(/^Truckcar\s*/i,''), e.endereco, (e.cidade||'').split(' · ')[0]].filter(Boolean).join(' · '))}</div><div class="oq-subh">Contato: ${esc(e.fone||'(51) 99908-4244')}</div></div></div>
    <span class="oq-orc"><span>Orçamentista: <b>${esc(O.orcamentista||'Dionatan')}</b></span><span>Nº <b id="oqNumTop">${esc(O.numero)}</b></span><span class="pill ${st==='aprovado'?'pago':st==='recusado'?'cancelado':'aberto'}">${ORC_ST[st]}</span></span>
  </header>
  <section class="card oq-cli" aria-label="Dados do cliente">
    <div class="f"><label for="oqNum">Nº orçamento</label>${inp('oqNum',O.numero,'class="n" inputmode="numeric"')}</div>
    <div class="f"><label for="oqCli">Cliente</label>${inp('oqCli',O.cliente,`list="oqClis" autocomplete="off" placeholder="Nome do cliente"`)}<datalist id="oqClis">${S.clientes.map(c=>`<option value="${esc(c.nome)}">`).join('')}</datalist></div>
    <div class="f"><label for="oqVei">Veículo / placa</label>${inp('oqVei',O.veiculo,'placeholder="Ex.: Scania R450 · ABC1D23"')}</div>
    <div class="f"><label for="oqData">Data</label>${inp('oqData',O.data,'type="date"')}</div>
  </section>
  <div class="oq-setores">${ORC_SET.map(setor).join('')}</div>
  <section class="card" aria-label="Observações"><div class="f"><label for="oqObs">Observações para o cliente (saem no PDF)</label><textarea id="oqObs" rows="3" data-inp="oqIn" placeholder="Ex.: Validade de 7 dias. Prazo de execução: 5 dias úteis. Pagamento: 50% na entrada e 50% na entrega."${dis}>${esc(O.obs||'')}</textarea></div></section>
  <section class="oq-total" aria-live="polite"><h2>Total do orçamento</h2><b id="oqTotal">—</b><span class="oq-det" id="oqDet"></span></section>
  ${trav?`<div class="warnbox">Orçamento aprovado: já virou conta a receber${O.lancIds&&O.lancIds.length?` (${O.lancIds.length} título(s), documento "Orç. ${esc(O.numero)}")`:''}. Para mudar valores, edite os títulos em Contas a receber ou desfaça a aprovação. <button type="button" class="btn sm" data-act="oqDesfazer" style="margin-left:8px">Desfazer aprovação</button></div>`:''}
  <section class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="oq-acoes">
      ${!trav?`<button class="btn oq-salvar" type="button" data-act="oqSalvar">Salvar orçamento</button>`:''}
      <button class="btn primary" type="button" data-act="oqPdf">Baixar PDF do orçamento</button>
      <button class="btn" type="button" data-act="oqWhats">Copiar resumo para WhatsApp</button>
      <button class="btn primary" type="button" data-act="oqNovo">Novo orçamento</button>
      <button class="btn" type="button" data-act="oqAnt" aria-expanded="${F.orcAnt}">Orçamentos anteriores${S.orcamentos.length?` (${S.orcamentos.length})`:''}</button>
      <span class="oq-estado ${salvo&&F.orcSalvo===orcSnap(O)?'ok':''}" id="oqEstado">${!salvo?'Ainda não salvo':F.orcSalvo===orcSnap(O)?'Salvo':'Alterações não salvas'}</span>
    </div>
    ${!trav?`<div class="oq-acoes oq-acoes2"><button class="btn primary" type="button" data-act="oqAprovar">Aprovar e gerar conta a receber</button>${salvo&&st==='aberto'?`<button class="btn" type="button" data-act="oqRecusar">Marcar como recusado</button>`:''}${st==='recusado'?`<button class="btn" type="button" data-act="oqReabrir">Reabrir</button>`:''}${salvo?`<button class="btn danger" type="button" data-act="oqExcluir">Excluir orçamento</button>`:''}</div>`:''}
    <textarea id="oqResumo" readonly aria-label="Resumo do orçamento" class="oq-resumo"></textarea>
    <p class="note">Campos em amarelo são editáveis. Preço do setor = (valor da hora × horas + material) × multiplicador. "Salvar orçamento" guarda o orçamento com o número da tela; baixar o PDF também salva. A numeração começa em ${ORC_INICIO} e segue a mesma sequência em qualquer aparelho (pode ser alterada à mão). "Aprovar" lança o orçamento em Contas a receber: unificado (valor total, em parcelas) ou separado por setor. O PDF e o resumo levam só os preços finais de cada setor, sem custos e multiplicadores.</p>
  </section>
  ${F.orcAnt?`<section class="card oq-ant" aria-label="Orçamentos anteriores">
    <div class="oq-ant-h"><h2>Orçamentos anteriores</h2><div class="chips" role="group" aria-label="Situação">${['todos','aberto','aprovado','recusado'].map(k=>`<button type="button" data-act="orcSt" data-v="${k}" aria-pressed="${F.orcSt===k}">${k==='todos'?'Todos':ORC_ST[k]}</button>`).join('')}</div><button class="btn sm" type="button" data-act="oqAnt">Fechar</button></div>
    <input id="oqBusca" type="search" value="${esc(F.orcQ)}" data-inp="orcQ" placeholder="Buscar por cliente, veículo, placa ou nº" aria-label="Buscar orçamento anterior">
    <div id="oqLista">${listaOrcAnt()}</div></section>`:''}
  </div>`;
}
function listaOrcAnt(){ const q=norm(F.orcQ);
  const ls=S.orcamentos.filter(o=>(F.orcSt==='todos'||o.status===F.orcSt) && (!q || norm([o.numero,o.cliente,o.veiculo].join(' ')).includes(q))).sort((a,b)=>(b.numero||'').localeCompare(a.numero||''));
  if(!S.orcamentos.length) return `<p class="note">Nenhum orçamento salvo ainda.</p>`;
  if(!ls.length) return `<p class="note">Nada encontrado.</p>`;
  return `<div class="tscroll"><table class="t"><thead><tr><th>Nº</th><th>Data</th><th>Cliente / veículo</th><th class="r">Total</th><th>Situação</th></tr></thead><tbody>${ls.map(o=>`<tr class="click" data-act="oqAbrir" data-id="${o.id}"><td class="num cell-main">${esc(o.numero)}</td><td class="num">${dataBR(o.data)}</td><td><div class="cell-main">${esc(o.cliente||'—')}</div><div class="cell-sub">${esc(o.veiculo||'')}</div></td><td class="r"><b>${brl(orcCalc(o).total)}</b></td><td><span class="pill ${o.status==='aprovado'?'pago':o.status==='recusado'?'cancelado':'aberto'}">${ORC_ST[o.status]||o.status}</span></td></tr>`).join('')}</tbody></table></div>`; }
CHG.orcQ=el=>{ F.orcQ=el.value; const l=$('#oqLista'); if(l) l.innerHTML=listaOrcAnt(); };
ACT.orcSt=el=>{ F.orcSt=el.dataset.v; render(); };

function oqLer(){ const O=F.orcEd, g=id=>{ const el=$('#'+id); return el?el.value:''; };
  O.numero=g('oqNum').trim(); O.cliente=g('oqCli').trim(); O.veiculo=g('oqVei').trim(); O.data=g('oqData'); O.obs=g('oqObs').trim();
  ORC_SET.forEach(s=>['hora','qt','mat','mult'].forEach(k=>{ O.setores[s.k][k]=parseNum(g('oq_'+s.k+'_'+k)); })); }
function oqResumo(O){ const c=orcCalc(O); return ['*ORÇAMENTO DE SERVIÇO TRUCKCAR* · Nº '+O.numero, O.orcamentista?'Orçamentista: '+O.orcamentista:null, O.cliente?'Cliente: '+O.cliente:null, O.veiculo?'Veículo: '+O.veiculo:null, O.data?'Data: '+dataBR(O.data):null, '', ...ORC_SET.map(s=>s.nome+': '+brl(c[s.k].preco)), '', '*Total: '+brl(c.total)+'*', O.obs?'\n'+O.obs:null].filter(x=>x!==null).join('\n'); }
function oqAtualizar(){ const O=F.orcEd; if(!O || !$('#oqTotal')) return; const c=orcCalc(O);
  ORC_SET.forEach(s=>{ const x=O.setores[s.k]; $('#oq_'+s.k+'_mo').textContent=brl((+x.hora||0)*(+x.qt||0)); $('#oq_'+s.k+'_custo').textContent=brl(c[s.k].custo); $('#oq_'+s.k+'_preco').textContent=brl(c[s.k].preco); });
  $('#oqTotal').textContent=brl(c.total); $('#oqDet').textContent=ORC_SET.map(s=>s.nome+' '+brl(c[s.k].preco)).join('  +  '); $('#oqNumTop').textContent=O.numero||'—'; $('#oqResumo').value=oqResumo(O);
  const es=$('#oqEstado'); if(es){ const ok=O.id&&F.orcSalvo===orcSnap(O); es.textContent=!O.id?'Ainda não salvo':ok?'Salvo':'Alterações não salvas'; es.classList.toggle('ok',!!ok); } }
CHG.oqIn=()=>{ oqLer(); oqAtualizar(); };
const _renderBase=render; render=function(){ _renderBase(); if(view==='orcamentos') oqAtualizar(); };

function oqSalvar(silencio){ oqLer(); const O=F.orcEd;
  if(!O.cliente){ toast('Informe o nome do cliente.'); $('#oqCli')&&$('#oqCli').focus(); return false; }
  if(!O.numero){ toast('Informe o número do orçamento.'); return false; }
  if(S.orcamentos.some(x=>x.id!==O.id && x.numero===O.numero)){ toast(`Já existe o orçamento nº ${O.numero}. Troque o número.`); return false; }
  if(!O.id) O.id=uid(); touch(O); const cp=clone(O); const i=S.orcamentos.findIndex(x=>x.id===O.id); if(i<0) S.orcamentos.push(cp); else S.orcamentos[i]=cp;
  salvarCol('orcamentos'); F.orcSalvo=orcSnap(O); if(!silencio) toast(`Orçamento Nº ${O.numero} salvo`); return true; }
ACT.oqSalvar=()=>{ if(oqSalvar()) render(); };
ACT.oqPdf=async b=>{ const O=F.orcEd; if(O.status!=='aprovado'){ if(!oqSalvar(true)) return; } await orcPDF(O,b); render(); };
ACT.oqWhats=()=>{ oqLer(); const ta=$('#oqResumo'); ta.value=oqResumo(F.orcEd); const fb=()=>{ ta.focus(); ta.select(); toast('Selecionei o resumo: copie com Ctrl+C'); };
  try{ navigator.clipboard.writeText(ta.value).then(()=>toast('Resumo copiado. Cole no WhatsApp.'),fb); }catch(e){ fb(); } };
ACT.oqNovo=()=>{ oqLer(); F.orcEd=orcNovoObj(); F.orcSalvo=''; render(); window.scrollTo({top:0}); const c=$('#oqCli'); if(c) c.focus(); toast('Novo orçamento Nº '+F.orcEd.numero); };
ACT.oqAnt=()=>{ oqLer(); F.orcAnt=!F.orcAnt; render(); if(F.orcAnt){ const p=document.querySelector('.oq-ant'); if(p) p.scrollIntoView({behavior:'smooth',block:'start'}); } };
ACT.oqAbrir=el=>{ const o=S.orcamentos.find(x=>x.id===el.dataset.id); if(!o) return; F.orcEd=clone(o); F.orcSalvo=orcSnap(F.orcEd); F.orcAnt=false; render(); window.scrollTo({top:0}); toast('Orçamento Nº '+o.numero+' aberto'); };
ACT.oqAprovar=()=>{ oqLer(); const O=F.orcEd; if(!O.cliente){ toast('Informe o nome do cliente.'); return; } if(!(orcCalc(O).total>0)){ toast('O orçamento está sem valor.'); return; } if(!oqSalvar(true)) return; aprovarOrc(O); };
const oqStatus=(st,msg)=>{ oqLer(); F.orcEd.status=st; if(oqSalvar(true)){ render(); toast(msg); } };
ACT.oqRecusar=()=>oqStatus('recusado','Orçamento marcado como recusado');
ACT.oqReabrir=()=>oqStatus('aberto','Orçamento reaberto');
let oqConf=0; ACT.oqExcluir=b=>{ const O=F.orcEd; if(Date.now()-oqConf>4000){ oqConf=Date.now(); b.textContent='Toque de novo para excluir'; return; }
  S.orcamentos=S.orcamentos.filter(x=>x.id!==O.id); salvarCol('orcamentos'); toast('Orçamento Nº '+O.numero+' excluído'); F.orcEd=orcNovoObj(); F.orcSalvo=''; render(); };

/* Aprovação: um título a receber por setor com valor */
const addDias=(iso,n)=>{ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function aprovarOrc(O){
  const c=orcCalc(O), setores=ORC_SET.filter(s=>c[s.k].preco>0), semConta=setores.filter(s=>!contaReceita(s.rec));
  let modo='unico', n=1, parc=[];
  const comp0=O.data||hoje();
  const gerar=()=>{ const v1=mv('apVenc')||hoje(), intv=mv('apInt'), dias=parseInt(mv('apDias'),10)||15; n=Math.max(1,parseInt(mv('apParc'),10)||1);
    const tot=modo==='unico'?c.total:null; parc=parc.slice(0,n); while(parc.length<n) parc.push({venc:'', valor:0, ed:false, ved:false});
    parc.forEach((p,i)=>{ if(!p.ed) p.venc=intv==='mensal'?addMeses(v1,i):addDias(v1,i*dias); });
    if(tot!==null){ const livres=parc.filter(p=>!p.ved), usado=parc.filter(p=>p.ved).reduce((a,p)=>a+p.valor,0), resto=Math.round((tot-usado)*100)/100, base=livres.length?Math.floor(resto/livres.length*100)/100:0;
      livres.forEach((p,k)=>p.valor= k===livres.length-1? Math.round((resto-base*(livres.length-1))*100)/100 : base); }
    desenhar(); };
  const desenhar=()=>{ const box=$('#sheet').querySelector('#apPrev'); if(!box) return;
    if(modo==='setor'){ box.innerHTML=`<div class="tscroll"><table class="t"><thead><tr><th>Título</th><th>Categoria</th><th>Vencimento</th><th class="r">Valor</th></tr></thead><tbody>
      ${setores.map(s=>`<tr><td>${esc(s.nome)} · Orç. ${esc(O.numero)}</td><td class="cell-sub">${esc(nomeConta(contaReceita(s.rec))||'(sem conta)')}</td><td class="num">${n>1?n+' parcelas a partir de '+dataBR(parc[0]&&parc[0].venc):dataBR(parc[0]&&parc[0].venc)}</td><td class="r">${brl(c[s.k].preco)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="3">${setores.length*n} título(s) no total</td><td class="r">${brl(c.total)}</td></tr></tfoot></table></div>`; return; }
    const soma=Math.round(parc.reduce((a,p)=>a+p.valor,0)*100)/100;
    box.innerHTML=`<div class="tscroll"><table class="t"><thead><tr><th>Parcela</th><th>Vencimento</th><th class="r">Valor (R$)</th></tr></thead><tbody>
      ${parc.map((p,i)=>`<tr><td class="num">${n>1?(i+1)+'/'+n:'Única'}</td><td style="min-width:160px"><input type="date" value="${p.venc}" data-api="${i}" data-apk="venc" aria-label="Vencimento ${i+1}"></td><td style="min-width:130px"><input class="n" inputmode="decimal" value="${fmoney(p.valor)}" data-api="${i}" data-apk="valor" aria-label="Valor ${i+1}"></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="2">Total</td><td class="r ${Math.abs(soma-c.total)>0.004?'neg-t':''}">${brl(soma)}</td></tr></tfoot></table></div>
      <p class="note" style="margin:0">${Math.abs(soma-c.total)>0.004?`<b class="neg-t">As parcelas somam ${brl(soma)}, mas o orçamento é ${brl(c.total)}.</b> `:''}Cada parcela é um título só, com o valor dividido entre ${setores.map(s=>s.nome+' ('+pct(c[s.k].preco/(c.total||1))+')').join(' e ')}: o DRE e o custeio continuam separando os setores.</p>`; };
  const corpo=`<p class="note" style="margin:0">Cliente <b>${esc(O.cliente)}</b> · orçamento nº ${esc(O.numero)} · total <b>${brl(c.total)}</b> (${setores.map(s=>s.nome+' '+brl(c[s.k].preco)).join(' + ')})</p>
    <div class="f"><label>Como lançar no Contas a receber</label><div class="chips" role="group" aria-label="Forma de lançamento">
      <button type="button" data-m="modo" data-v="unico" aria-pressed="true">Unificado: valor total do orçamento</button><button type="button" data-m="modo" data-v="setor" aria-pressed="false">Separado por setor</button></div></div>
    <div class="fields">
      <div class="f s2"><label for="apComp">Competência (mês da venda)</label><input id="apComp" type="date" value="${comp0}"></div>
      <div class="f s2"><label for="apForma">Forma de recebimento</label><select id="apForma">${formaOptions('Boleto','R')}</select></div>
      <div class="f s2"><label for="apParc">Parcelas</label><select id="apParc">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i?(i+1)+'x':'À vista (1x)'}</option>`).join('')}</select></div>
      <div class="f s2"><label for="apVenc">1º vencimento</label><input id="apVenc" type="date" value="${hoje()}"></div>
      <div class="f s2"><label for="apInt">Intervalo</label><select id="apInt"><option value="mensal">Mensal</option><option value="dias">A cada X dias</option></select></div>
      <div class="f s2" id="apDiasBox" hidden><label for="apDias">Dias entre parcelas</label><input id="apDias" class="n" inputmode="numeric" value="15"></div>
    </div>
    <div id="apPrev"></div>
    ${semConta.length?`<div class="warnbox">Não encontrei no plano de contas a receita ${semConta.map(s=>s.nome).join(' / ')}. Cadastre a conta em Plano de contas antes de aprovar.</div>`:''}`;
  abrirModal('Aprovar orçamento', corpo, `<span></span><div class="row"><button class="btn" data-m="fechar">Cancelar</button><button class="btn primary" data-m="ok"${semConta.length?' disabled':''}>Aprovar e lançar</button></div>`, {
    modo:b=>{ modo=b.dataset.v; $('#sheet').querySelectorAll('[data-m="modo"]').forEach(x=>x.setAttribute('aria-pressed',x===b)); parc.forEach(p=>p.ved=false); gerar(); },
    change:el=>{ if(el.dataset.api!==undefined){ const p=parc[+el.dataset.api]; if(el.dataset.apk==='venc'){ p.venc=el.value; p.ed=true; } else { p.valor=Math.round(parseNum(el.value)*100)/100; p.ved=true; if(parc.every(x=>x.ved)) parc.forEach((x,j)=>{ if(j!==+el.dataset.api) x.ved=false; }); } gerar(); return; }
      if(el.id==='apInt'){ $('#sheet').querySelector('#apDiasBox').hidden=el.value!=='dias'; parc.forEach(p=>p.ed=false); }
      if(el.id==='apVenc'||el.id==='apDias') parc.forEach(p=>p.ed=false);
      if(['apParc','apVenc','apInt','apDias'].includes(el.id)) gerar(); },
    ok:()=>{ gerar(); const comp=mv('apComp')||comp0, forma=mv('apForma');
      if(parc.some(p=>!p.venc)){ toast('Preencha o vencimento de todas as parcelas.'); return; }
      if(modo==='unico' && Math.abs(parc.reduce((a,p)=>a+p.valor,0)-c.total)>0.004){ toast('A soma das parcelas precisa ser igual ao total do orçamento.'); return; }
      const p=achaOuCriaPessoa('R',O.cliente), ids=[], gid=n>1?uid():'';
      const novo=(o)=>{ const l=touch(Object.assign({id:uid(), tipo:'R', pessoaId:p.id, pessoaNome:p.nome, documento:'Orç. '+O.numero, competencia:comp, forma, boleto:'', obs:O.obs||'', status:'aberto', orcamentoId:O.id}, o)); S.lancamentos.push(l); ids.push(l.id); };
      if(modo==='unico'){ const partes0=setores.map(s=>({contaId:contaReceita(s.rec), valor:c[s.k].preco})), princ=partes0.slice().sort((a,b)=>b.valor-a.valor)[0];
        parc.forEach((x,i)=>novo({descricao:`Orçamento ${O.numero} · ${setores.map(s=>s.nome).join(' + ')}${O.veiculo?' · '+O.veiculo:''}`, contaId:princ.contaId, rateio:setores.length>1?arredondaPartes(partes0.map(q=>({contaId:q.contaId, valor:q.valor*x.valor/c.total})), x.valor):null, vencimento:x.venc, valor:x.valor, parcela:n>1?(i+1)+'/'+n:'', grupoParcelas:gid})); }
      else { setores.forEach(s=>{ const tot=c[s.k].preco, base=Math.floor(tot/n*100)/100, g2=n>1?uid():'';
        parc.forEach((x,i)=>novo({descricao:`${s.nome}${O.veiculo?' · '+O.veiculo:''}`, contaId:contaReceita(s.rec), vencimento:x.venc, valor:i===n-1?Math.round((tot-base*(n-1))*100)/100:base, parcela:n>1?(i+1)+'/'+n:'', grupoParcelas:g2})); }); }
      O.status='aprovado'; O.aprovadoEm=agora(); O.lancIds=ids; touch(O); const i=S.orcamentos.findIndex(x=>x.id===O.id); if(i<0) S.orcamentos.push(clone(O)); else S.orcamentos[i]=clone(O); F.orcSalvo=orcSnap(O);

/* Desfazer aprovação: apaga os títulos ainda não recebidos e reabre o orçamento */
ACT.oqDesfazer=b=>{ const O=F.orcEd, ls=S.lancamentos.filter(l=>l.orcamentoId===O.id);
  if(ls.some(l=>l.status==='pago')){ toast('Já há recebimento registrado neste orçamento. Estorne os recebimentos antes de desfazer.'); return; }
  if(b.dataset.c!=='1'){ b.dataset.c='1'; b.textContent=`Confirmar: apagar ${ls.length} título(s) e reabrir`; return; }
  S.lancamentos=S.lancamentos.filter(l=>l.orcamentoId!==O.id); O.status='aberto'; O.lancIds=[]; delete O.aprovadoEm; touch(O);
  const i=S.orcamentos.findIndex(x=>x.id===O.id); if(i>=0) S.orcamentos[i]=clone(O); F.orcSalvo=orcSnap(O);

      if(sel.includes('cli')){ S.clientes=[]; cols.push('clientes'); }
      if(sel.includes('for')){ S.fornecedores=[]; cols.push('fornecedores'); }
      if(sel.includes('ins')){ S.insumos=[]; cols.push('insumos'); }

      const lista=S.usuarios.itens.filter(z=>z!==u).concat([Object.assign({},u||{},dados)]);
      if(!lista.filter(z=>z.ativo!==false).some(ehAdmin)){ toast('Pelo menos um usuário ativo precisa ter "Editar" em Usuários e permissões.'); return; }
      if(u && USR && USR.id===u.id && ehAdmin(u) && !ehAdmin(Object.assign({},u,dados))){ toast('Você não pode tirar o seu próprio acesso de administrador.'); return; }
      const F=window.FB; b.disabled=true;
      try{ let id=u&&u.id;
        if(novo){ const s1=mv('uSenha'), s2=mv('uSenha2'); if(s1.length<6){ toast('A senha precisa ter pelo menos 6 caracteres.'); b.disabled=false; return; } if(s1!==s2){ toast('A confirmação não confere com a senha.'); b.disabled=false; return; }
          if(S.usuarios.itens.some(z=>String(z.email).toLowerCase()===email)){ toast('Já existe um usuário com esse e-mail.'); b.disabled=false; return; }
          id=await criarContaAuth(email,s1); dados.criadoEm=agora(); }
        await F.fn.setDoc(F.fn.doc(F.db,'usuarios',id), Object.assign({}, u?{criadoEm:u.criadoEm||agora()}:{}, dados));
        fecharModal(); toast(novo?'Usuário criado. Passe o e-mail e a senha inicial para a pessoa.':'Usuário atualizado'); }
      catch(e){ b.disabled=false; toast(ERR_AUTH[e&&e.code]||('Não foi possível salvar: '+((e&&e.code)||'erro'))); } } });
  $('#sheet').classList.add('lg');
}

/* Backup */
async function fazerBackup(){
  if(nivel('config')==='nenhum'){ toast('Seu usuário não tem acesso ao backup.'); return; }
  const dados={versao:1, sistema:'ERP Truckcar', exportadoEm:agora(), cfg:S.cfg, plano:S.plano, bancos:S.bancos, formas:S.formas, ajustes:S.ajustes, logo:S.logo, lancamentos:S.lancamentos, fornecedores:S.fornecedores, clientes:S.clientes, notas:S.notas, insumos:S.insumos, orcamentos:S.orcamentos};
  const json=JSON.stringify(dados).replace(/</g,'\\u003c'); const tag='<scr'+'ipt id="app-js">'; const i=SRC.indexOf(tag);
  const html=i<0?SRC:SRC.slice(0,i)+'<scr'+'ipt id="backup-data" type="application/json">'+json+'</scr'+'ipt>\n'+SRC.slice(i);
  const d=new Date(); const nome=`ERP-Truckcar-backup-${hoje()}_${pad(d.getHours())}${pad(d.getMinutes())}.html`;
  if(await baixar(new Blob([html],{type:'text/html'}), nome)){ S.cfg.ultimoBackup=dados.exportadoEm; SYS=true; salvarDoc('geral'); SYS=false; if(view==='config') render(); toast(`Backup salvo com ${S.lancamentos.length} lançamentos`); }
}
function aplicarBackup(d){
  if(!d || !Array.isArray(d.lancamentos)) throw new Error('inv'); let novos=0, atual=0;
  COLS.forEach(col=>{ const map=new Map(S[col].map(o=>[o.id,o])); (d[col]||[]).forEach(o=>{ if(!o||!o.id) return; const l=map.get(o.id); if(!l){ map.set(o.id,o); if(col==='lancamentos') novos++; } else if((o.atualizadoEm||'')>(l.atualizadoEm||'')){ map.set(o.id,o); if(col==='lancamentos') atual++; } }); S[col]=[...map.values()]; salvarCol(col); });
  if(d.cfg){ const z=S.cfg.zerado; S.cfg=normCfg(d.cfg); delete S.cfg.senha; if(z) S.cfg.zerado=z; else delete S.cfg.zerado; salvarDoc('geral'); } if(d.plano&&Array.isArray(d.plano.grupos)){ S.plano=d.plano; salvarDoc('plano'); } if(d.bancos){ S.bancos=d.bancos; salvarDoc('bancos'); } if(d.formas&&Array.isArray(d.formas.itens)){ S.formas=d.formas; salvarDoc('formas'); }  if(d.ajustes){ S.ajustes=d.ajustes; salvarDoc('ajustes'); } if(typeof d.logo==='string'){ S.logo=d.logo; salvarDoc('logo'); }
  marca(); return {novos,atual};
}
ACT.backup=fazerBackup; $('#btnBackup').addEventListener('click',fazerBackup);

let MODO_SETUP=false;

const ERR_LOGIN={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/invalid-email':'E-mail inválido.','auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos ou use "Esqueci minha senha".','auth/network-request-failed':'Sem conexão com a internet.','auth/email-already-in-use':'Este e-mail já tem conta. Volte e entre normalmente.','auth/weak-password':'Senha fraca: use pelo menos 6 caracteres.'};
async function bootFirebase(F){
  const fn=F.fn; let bootstrap=null;
  try{ const b=await fn.getDoc(fn.doc(F.db,'config','bootstrap')); bootstrap=b.exists()?b.data():null; }catch(e){ bootstrap={erro:true}; }
  $('#lockSetup').hidden=!!bootstrap;
  $('#lockBtn').disabled=false; $('#lockBtn').textContent='Entrar';
  try{ const m=sessionStorage.getItem('truckcar.erp.msg'); if(m){ msgLock(m); sessionStorage.removeItem('truckcar.erp.msg'); } }catch(e){}
  let unsubPerfil=null;
  fn.onAuthStateChanged(F.auth, async user=>{
    if(unsubPerfil){ unsubPerfil(); unsubPerfil=null; }
    if(!user){ if(USR) location.reload(); return; }
    if(MODO_SETUP) return;
    try{ const ref=fn.doc(F.db,'usuarios',user.uid); const snap=await fn.getDoc(ref);
      if(!snap.exists()){ msgLock('Este e-mail não tem acesso ao ERP. Fale com o administrador.'); await fn.signOut(F.auth); return; }
      const p=Object.assign({},snap.data(),{id:user.uid, email:user.email});
      if(p.ativo===false){ msgLock('Seu usuário está inativo. Fale com o administrador.'); await fn.signOut(F.auth); return; }
      if(LS.get('dono','')!==user.uid){ limparDadosLocais(); COLS.forEach(c=>S[c]=[]); LS.set('dono',user.uid); }
      entrar(p); conectarDB();
      unsubPerfil=fn.onSnapshot(ref, s=>{ if(!s.exists() || s.data().ativo===false){ sairSistema('Seu acesso foi alterado. Fale com o administrador.'); return; }
        const n=Object.assign({},s.data(),{id:user.uid, email:user.email}); const mudou=JSON.stringify(n.perms)!==JSON.stringify(USR&&USR.perms); USR=n; aplicarPermsUI();
        if(mudou){ if(!podeVer(view)){ const v=primeiraView(); if(v) go(v); } else render(); } });
    }catch(e){ msgLock('Não consegui carregar o seu usuário ('+(e.code||'erro')+'). Tente de novo.'); try{ await fn.signOut(F.auth); }catch(_){} }
  });
}
async function criarAdministrador(F, nome, email, senha){ const fn=F.fn;
  const cr=await fn.createUserWithEmailAndPassword(F.auth, email, senha); const uid=cr.user.uid;
  const batch=fn.writeBatch(F.db);
  batch.set(fn.doc(F.db,'usuarios',uid), {nome, email, ativo:true, perms:permsPerfil('admin'), criadoEm:agora(), atualizadoEm:agora()});
  batch.set(fn.doc(F.db,'config','bootstrap'), {admin:uid, em:agora()});
  await batch.commit(); MODO_SETUP=false; location.reload(); }
$('#lockForm').addEventListener('submit',async e=>{ e.preventDefault(); const F=window.FB; if(!F) return; const btn=$('#lockBtn'); const email=$('#lockUser').value.trim().toLowerCase(), senha=$('#lockPass').value;
  if(!email||!senha){ msgLock('Informe o e-mail e a senha.'); return; }
  btn.disabled=true; msgLock(MODO_SETUP?'Criando…':'Conferindo…');
  try{ if(MODO_SETUP){ const nome=$('#lockNome').value.trim(); if(!nome){ msgLock('Informe o seu nome.'); return; } if(senha.length<6){ msgLock('Use pelo menos 6 caracteres na senha.'); return; } if(senha!==$('#lockPass2').value){ msgLock('A confirmação não confere com a senha.'); return; }
      await criarAdministrador(F, nome, email, senha); }
    else { await F.fn.signInWithEmailAndPassword(F.auth, email, senha); msgLock(''); $('#lockPass').value=''; $('#lockPass').type='password'; } }
  catch(err){ msgLock(ERR_LOGIN[err&&err.code] || (err&&err.code==='permission-denied'?'O sistema já tem administrador. Peça a ele para criar o seu usuário.':'Não foi possível entrar ('+((err&&err.code)||'erro')+').')); }
  finally{ btn.disabled=false; } });
$('#lockReset').addEventListener('click',()=>{ const F=window.FB, email=$('#lockUser').value.trim(); if(!email){ msgLock('Digite o seu e-mail acima e toque de novo em "Esqueci minha senha".'); $('#lockUser').focus(); return; }
  F.fn.sendPasswordResetEmail(F.auth, email).then(()=>msgLock('Se este e-mail tiver acesso, chega em instantes um link para criar uma nova senha. Confira também o spam.')).catch(err=>msgLock(ERR_LOGIN[err&&err.code]||'Não consegui enviar agora. Tente de novo.')); });
$('#lockSetup').addEventListener('click',()=>modoSetup(!MODO_SETUP));
$('#btnSair').addEventListener('click',()=>sairSistema(''));
