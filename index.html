<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ERP Truckcar</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: menu lateral fixo (vira gaveta no tablet), barra superior com ano/backup/engrenagem, telas em cartões; tabelas largas rolam dentro do próprio cartão */
:root{
  --bg:#ebeff1; --surface:#ffffff; --surface-2:#f4f7f8; --ink:#18233a; --muted:#566576; --line:#d0d8de;
  --accent:#1e6f73; --accent-ink:#ffffff; --accent-soft:#dff0f0;
  --side:#18233a; --side-ink:#c9d3e0; --side-hi:#ffffff; --side-act:#24344f;
  --pos:#1e7a46; --pos-soft:#e1f2e8; --neg:#b42318; --neg-soft:#fbe7e5; --warn:#9a5b0c; --warn-soft:#fff4d6;
  --bar-a:#1e6f73; --bar-b:#9aa8b8; --rd-rec:#3b78c2; --rd-desp:#e8917f; --rd-fixa:#8a76c9; --rd-ll:#8fd6a8; --rd-lltx:#2e8f57; --rd-llneg:#f2b8ae;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --oq-input:#fff7d6; --oq-save:#1d4f91;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#18202a; --surface-2:#1e2833; --ink:#e5eaef; --muted:#93a0ae; --line:#2c3846;
  --accent:#62bfc2; --accent-ink:#0b1a1c; --accent-soft:#16312f;
  --side:#0b1016; --side-ink:#a9b6c6; --side-hi:#ffffff; --side-act:#1b2735;
  --pos:#5fcb8b; --pos-soft:#163024; --neg:#f2867c; --neg-soft:#3a1c1a; --warn:#e8b05a; --warn-soft:#332a12;
  --bar-a:#62bfc2; --bar-b:#5b6878; --rd-rec:#6ea3e3; --rd-desp:#ee9d8c; --rd-fixa:#a99ae0; --rd-ll:#7fcf9b; --rd-lltx:#8fdcaa; --rd-llneg:#a5574b; --oq-input:#2a2614; --oq-save:#3b7fd4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#18202a; --surface-2:#1e2833; --ink:#e5eaef; --muted:#93a0ae; --line:#2c3846;
  --accent:#62bfc2; --accent-ink:#0b1a1c; --accent-soft:#16312f;
  --side:#0b1016; --side-ink:#a9b6c6; --side-hi:#ffffff; --side-act:#1b2735;
  --pos:#5fcb8b; --pos-soft:#163024; --neg:#f2867c; --neg-soft:#3a1c1a; --warn:#e8b05a; --warn-soft:#332a12;
  --bar-a:#62bfc2; --bar-b:#5b6878; --rd-rec:#6ea3e3; --rd-desp:#ee9d8c; --rd-fixa:#a99ae0; --rd-ll:#7fcf9b; --rd-lltx:#8fdcaa; --rd-llneg:#a5574b; --oq-input:#2a2614; --oq-save:#3b7fd4; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance;text-transform:uppercase}
.num,.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Login */
.lock{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lock-box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:14px}
.lock-box .lg{background:#fff;border-radius:10px;padding:10px;display:grid;place-items:center}
.lock-box .lg img{height:90px;width:auto}
.lock-box h1{font-size:26px;text-align:center}

/* Estrutura */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:16px 12px 24px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 4px}
.side .brand .lg{background:#fff;border-radius:10px;padding:6px 10px}
.side .brand img{height:52px;width:auto;display:block}
.side .brand b{font-family:var(--f-display);text-transform:uppercase;color:var(--side-hi);font-size:15px;letter-spacing:.06em}
.nav-sec{font:700 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:#F4B740;padding:14px 10px 5px;display:flex;align-items:center;gap:8px}
.nav .nav-dest{color:#F4B740;font-weight:700}
.nav-sec::after{content:"";flex:1;height:1px;background:rgba(244,183,64,.28)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--side-ink);font-size:14px;min-height:40px}
.nav button:hover{background:var(--side-act);color:var(--side-hi)}
.nav button[aria-current="page"]{background:var(--side-act);color:var(--side-hi);box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar h1{font-size:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-height:42px;min-width:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--muted);font-weight:600;cursor:pointer}
.iconbtn:hover{color:var(--ink)}
.iconbtn svg{width:19px;height:19px;flex:none}
.menu-btn{display:none}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.usr{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;white-space:nowrap}
.usr button{font:inherit;font-size:12px;font-weight:700;border:0;background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer}
.usr button:hover{color:var(--neg)}
body.ro #view .btn.primary, body.ro #view .btn.danger, body.ro #view label.btn.primary, body.ro .sheet-f .btn.primary, body.ro .sheet-f .btn.danger, body.ro .sheet-f [data-m="salvarBaixar"], body.ro .sheet-f [data-m="cancelar"], body.ro .sheet-f [data-m="reativar"], body.ro #view [data-act="baixar"], body.ro #view [data-act="estornar"]{display:none!important}
.ro-tag{display:none}
body.ro .ro-tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.perm-t td,.perm-t th{padding:7px 10px}
.pw-wrap{position:relative;display:block}
.pw-wrap input{padding-right:46px!important}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:34px;border:0;background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;display:grid;place-items:center}
.pw-eye:hover{color:var(--ink);background:var(--surface-2)}
.pw-eye svg{width:20px;height:20px}
@media (max-width:700px){.topbar .sync{display:none} body.ro .ro-tag{font-size:10px;padding:2px 7px} .usr{padding-left:9px} #usrName{max-width:90px;overflow:hidden;text-overflow:ellipsis}}
@media (max-width:480px){#usrName{display:none} .usr{padding:3px} body.ro .ro-tag{font-size:0;padding:0;width:10px;height:10px;background:var(--warn)}}
.perm-t .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.perm-t .seg label{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.perm-t .seg input{position:absolute;opacity:0;pointer-events:none}
.perm-t .seg label:has(input:checked){background:var(--brand,#1e6f73);color:#fff}
.perm-t .seg label:has(input[value="nenhum"]:checked){background:var(--surface-2);color:var(--ink)}
.perm-t .seg label:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:-2px}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:1px}
.sync.on::before{background:var(--pos)}
#view{padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .app.open .side{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
  .menu-btn{display:inline-flex}
  .sync{display:none}
}
@media (max-width:520px){.iconbtn span{display:none}.topbar h1{font-size:20px}}

/* Componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{font-size:20px}
.hint{font-size:12.5px;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;justify-content:space-between}
.bar .grow{flex:1 1 auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:14.5px}
textarea{min-height:64px;resize:vertical}
input.n{text-align:right}
.fields{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.fields .f{grid-column:span 3}.fields .s2{grid-column:span 2}.fields .s4{grid-column:span 4}.fields .s6{grid-column:span 6}
@media (max-width:560px){.fields .f{grid-column:span 6}}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;min-height:40px}
.check input{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
.mcat{position:relative}
.mcat summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer;font-size:14.5px;white-space:nowrap;overflow:hidden}
.mcat summary::-webkit-details-marker{display:none}
.mcat summary span{overflow:hidden;text-overflow:ellipsis}
.mcat summary::after{content:"▾";color:var(--muted);flex:none}
.mcat.on summary{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.mcat-p{position:absolute;z-index:25;left:0;right:0;min-width:300px;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;max-height:min(420px,60vh)}
.mcat-top{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.mcat-l{overflow-y:auto;padding:4px 0}
.mcat-g{padding:4px 0;border-bottom:1px solid var(--line)}
.mcat-g:last-child{border-bottom:0}
.mcat label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;min-height:34px;padding:2px 12px}
.mcat label:hover{background:var(--surface-2)}
.mcat .mcat-c{padding-left:36px;color:var(--ink)}
.mcat input[type=checkbox]{width:18px;height:18px;min-height:0;flex:none;accent-color:var(--accent)}
.cl-sel{width:auto;min-height:34px;padding:4px 8px;font-size:13px;max-width:200px}
.grp li{flex-wrap:wrap}
.th-sort{cursor:pointer;user-select:none}
.th-sort:hover{color:var(--ink)}
.th-sort.on{color:var(--accent)}
.th-sort .ord{margin-left:4px;font-size:10px;opacity:.6}
.th-sort.on .ord{opacity:1}
.rp-dt{display:flex;align-items:end;gap:6px;padding:6px 10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.rp-dt .rp-dl{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);align-self:center;min-width:86px}
.rp-dt input{background:var(--surface)}
.cu-par{display:flex;flex-direction:column;gap:12px;padding:12px 16px}
.cu-par-row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.cu-grp{flex:0 0 auto;max-width:100%}
@media (max-width:700px){.cu-grp{flex-wrap:wrap}}
.cu-grp .rp-dl{min-width:64px}
.cu-grp .chips{flex-wrap:nowrap}
.cu-grp .chips button{white-space:nowrap;flex:none}
.cu-suf{display:flex;align-items:center;gap:6px}.cu-suf span{font-size:12px;color:var(--muted);white-space:nowrap}
.cu-ro{min-height:40px;display:flex;align-items:center;padding:0 10px;border:1px dashed var(--line);border-radius:8px;font-family:var(--f-num);color:var(--muted)}
.cu-fixo{display:flex;flex-direction:column;gap:2px;padding:6px 12px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:6px}
.cu-fixo small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.cu-fixo b{font-family:var(--f-num);font-size:20px;font-weight:500}
.cu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.cu-set{display:flex;flex-direction:column;gap:14px}
.cu-set-h h2{font-size:22px}
.cu-big{background:var(--accent-soft);border-radius:10px;padding:14px 16px}
.cu-big small{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.cu-big b{display:block;font-family:var(--f-num);font-size:34px;font-weight:500;color:var(--accent);margin-top:2px}
.cu-dl{margin:0;display:flex;flex-direction:column}
.cu-dl div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.cu-dl dt{color:var(--muted)}.cu-dl dd{margin:0;font-family:var(--f-num);text-align:right}
.cu-preco{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cu-preco div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.cu-preco div.on{border-color:var(--accent)}
.cu-preco small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cu-preco b{font-family:var(--f-num);font-size:20px;font-weight:500}.cu-preco div.on b{color:var(--accent)}
.cu-preco span{font-size:12px;color:var(--muted)}
.cu-cob{display:flex;flex-direction:column;gap:6px}
.cu-cob-h{display:flex;justify-content:space-between;font-size:14px}.cu-cob-h b{font-family:var(--f-num);font-weight:500}
.cu-cob .tr{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}.cu-cob .tr i{display:block;height:100%;border-radius:6px}
.cu-tg{all:unset;cursor:pointer;font:600 15px var(--f-body);display:flex;gap:8px;align-items:center}
.cu-tg::before{content:"▸";font-size:11px;color:var(--muted);transition:transform .15s}.cu-tg[aria-expanded="true"]::before{transform:rotate(90deg)}
.cu-ol{margin:12px 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
@media (max-width:420px){.cu-preco{grid-template-columns:1fr}}
.orc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.orc-grid{grid-template-columns:1fr}}
.orc-set{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.orc-set h3{font-family:var(--f-display);text-transform:uppercase;font-size:20px;margin:0;color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:6px}
.orc-preco{background:var(--accent-soft);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.orc-preco small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.orc-preco b{font-family:var(--f-num);font-weight:500;font-size:20px;color:var(--accent)}
.orc-total{background:var(--side);color:var(--side-hi);border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.orc-total span{font-family:var(--f-display);text-transform:uppercase;font-size:20px;letter-spacing:.02em}
.orc-total b{font-family:var(--f-num);font-weight:500;font-size:26px}
.oq{display:flex;flex-direction:column;gap:16px;max-width:1000px;width:100%}
.oq h1,.oq h2{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.oq-top{background:var(--side);color:var(--side-hi);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.oq-marca{display:flex;align-items:center;gap:14px;min-width:0}
.oq-lg{background:#fff;border-radius:10px;padding:6px 10px;flex:none}.oq-lg img{height:56px;width:auto;display:block}
.oq-top h1{font-size:26px;line-height:1.05}.oq-subh{font-size:12.5px;opacity:.7;margin-top:2px}
.oq-orc{font-size:13px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}.oq-orc b{font-family:var(--f-num);font-weight:500}
@media (max-width:520px){.oq-lg img{height:44px}.oq-top h1{font-size:21px}.oq-orc{text-align:left;align-items:flex-start}}
.oq-cli{display:grid;grid-template-columns:110px 2fr 1.4fr 1fr;gap:10px}
@media (max-width:640px){.oq-cli{grid-template-columns:1fr}}
.oq input:not([type=search]),.oq textarea:not(.oq-resumo){background:var(--oq-input);min-height:42px;font-size:15px}
.oq input:disabled,.oq textarea:disabled{opacity:.75;cursor:not-allowed}
.oq-setores{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.oq-setores{grid-template-columns:1fr}}
.oq-setor{display:flex;flex-direction:column;gap:12px}
.oq-setor-h{border-bottom:2px solid var(--accent);padding-bottom:8px}.oq-setor-h h2{font-size:24px;color:var(--accent)}
.oq-lin{display:grid;grid-template-columns:1fr 110px 90px;gap:8px;align-items:end}
.oq-tot{grid-column:1/-1;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:-4px}

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const hoje=()=>{ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const agora=()=>new Date().toISOString();
function parseNum(v){ if(typeof v==='number') return isFinite(v)?v:0; v=String(v??'').trim().replace(/[R$\s%]/g,''); if(!v) return 0; if(v.includes(',')) v=v.replace(/\./g,'').replace(',','.'); const n=parseFloat(v); return isFinite(n)?n:0; }
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmoney=n=>(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmoneyIn=n=>n?fmoney(n):'';

let DB=null; const syncMap={}; COLS.forEach(c=>syncMap[c]=new Map());
const docSync={}, docPend={}, docTimer={}; const filas=new Map(); let avisouErro=false;
function fila(key,fn){ const prev=filas.get(key)||Promise.resolve(); filas.set(key, prev.then(fn).catch(erroDB)); }
function erroDB(e){ const c=e&&e.code;
  if(c==='quota_exceeded') toast('Espaço na nuvem cheio. Faça um backup e exclua lançamentos antigos.');
  else if(c==='invalid_argument' && !avisouErro){ avisouErro=true; toast('Sem permissão para salvar na nuvem. Os dados ficam só neste aparelho.'); }
  else if(c==='revoked'){ DB=null; statusSync(); }
  else if(c==='permission-denied'){ toast('O servidor recusou a gravação: seu usuário não tem permissão para isso.'); }
  else if(c==='resource-exhausted'){ toast('Limite diário do plano gratuito atingido. Tente de novo mais tarde.'); }
  else if(c==='unavailable'){ /* offline: o Firestore reenvia sozinho */ } }
function syncCol(col){ if(!DB) return; const atuais=new Set();
  S[col].forEach(o=>{ atuais.add(o.id); const j=JSON.stringify(o); if(syncMap[col].get(o.id)!==j){ syncMap[col].set(o.id,j); fila(col+'/'+o.id, ()=>DB.collection(col).doc(o.id).set(JSON.parse(j))); } });
  [...syncMap[col].keys()].forEach(id=>{ if(!atuais.has(id)){ syncMap[col].delete(id); fila(col+'/'+id, ()=>DB.collection(col).doc(id).delete()); } }); }
function aoReceberCol(col,snap){
  const server=new Map(); snap.docs.forEach(d=>{ const o=d.data(); if(o && o.id) server.set(o.id, clone(o)); });
  const nova=[], vistos=new Set();
  S[col].forEach(o=>{ const sv=server.get(o.id); if(sv){ vistos.add(o.id); nova.push(((o.atualizadoEm||'')>(sv.atualizadoEm||''))?o:sv); } else if(!syncMap[col].has(o.id)) nova.push(o); });
  server.forEach((sv,id)=>{ if(!vistos.has(id)) nova.push(sv); });
  syncMap[col].clear(); server.forEach((sv,id)=>syncMap[col].set(id, JSON.stringify(sv)));
  S[col]=nova; LS.set(col,S[col]); setTimeout(()=>syncCol(col),0); pedirRender();
}
function agendarDoc(n){ if(!DB) return; docPend[n]=true; clearTimeout(docTimer[n]); docTimer[n]=setTimeout(()=>enviarDoc(n),700); }
function enviarDoc(n){ docPend[n]=false; if(!DB) return; const j=JSON.stringify(docVal(n)); if(j!==docSync[n]){ docSync[n]=j; fila('config/'+n, ()=>DB.doc('config/'+n).set(JSON.parse(j))); } }
function aoReceberDoc(n,snap){
  if(!snap.exists){ if(docSync[n]===undefined){ docSync[n]=''; if(nivel('config')==='editar') setTimeout(()=>enviarDoc(n),0); } return; }
  if(docPend[n]) return;
  const j=JSON.stringify(snap.data()); if(j===docSync[n]) return; docSync[n]=j; aplicarDoc(n, JSON.parse(j)); marca(); pedirRender();
}
function statusSync(){ const el=$('#syncState'); el.textContent=DB?'Salvo na nuvem':'Salvo neste aparelho'; el.classList.toggle('on',!!DB); el.title=DB?'Os dados ficam no servidor e aparecem em qualquer aparelho.':'Sem conexão com o servidor. Os dados ficam neste aparelho até a conexão voltar.'; }
function shimFS(F){ const {db,fn}=F, w=s=>({exists:s.exists(), data:()=>s.data()});
  return { collection:c=>({ onSnapshot:(cb,err)=>fn.onSnapshot(fn.collection(db,c), s=>cb({docs:s.docs.map(d=>({id:d.id, data:()=>d.data()}))}), err),
      doc:id=>({ set:d=>fn.setDoc(fn.doc(db,c,id),d), delete:()=>fn.deleteDoc(fn.doc(db,c,id)) }) }),
    doc:p=>({ onSnapshot:(cb,err)=>fn.onSnapshot(fn.doc(db,p), s=>cb(w(s)), err), get:async()=>w(await fn.getDoc(fn.doc(db,p))), set:d=>fn.setDoc(fn.doc(db,p),d), delete:()=>fn.deleteDoc(fn.doc(db,p)) }) }; }

/* ---------- Download (no Claude pede confirmação; no arquivo, baixa direto) ---------- */
async function baixar(blob,nome){
  if(window.claude && typeof window.claude.use==='function'){
    try{ const d=await window.claude.use('downloads'); if(d){ await d.save({filename:nome, data:blob}); return true; } }
    catch(err){ if(err && err.code==='declined') return false; }
  }
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000); return true;
}

function graficoLinhas(series, labs, pctV, tem){
  const N=labs.length, W=760, H=310, pl=64, pr=10, pt=50, pb=46, n=series.length; const max=Math.max(1,...series.flatMap(x=>x.v)); const step=niceStep(max);
  const top=Math.ceil(max/step)*step; const y=v=>pt+(H-pt-pb)*(1-v/top); const cw=(W-pl-pr)/N, bw=Math.min(15,cw*0.27), g=2, fs=N>18?9:N>12?10:11;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas, despesas fixas e despesas variáveis por mês">`;
  for(let v=0; v<=top+1e-9; v+=step) s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${abrev(v)}</text>`;
  for(let i=0;i<N;i++){ const cx=pl+cw*i+cw/2, x0=cx-(n*bw+(n-1)*g)/2;
    series.forEach((sr,k)=>{ const v=sr.v[i]||0, x=x0+k*(bw+g);
      s+=`<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0,y(0)-y(v))}" rx="2" fill="${sr.c}"><title>${labs[i]} · ${sr.n.toLowerCase()} ${brl(v)}</title></rect>`;
      if(v>0){ const xx=x+bw/2, yy=y(v)-5; s+=`<text class="bv" x="${xx}" y="${yy}" transform="rotate(-90 ${xx} ${yy})" text-anchor="start" dominant-baseline="central" style="fill:${sr.t||sr.c};font-size:${fs}px">${Math.round(v).toLocaleString('pt-BR')}</text>`; } });
    s+=`<text x="${cx}" y="${H-24}" text-anchor="middle"${N>12?' style="font-size:10px"':''}>${labs[i]}</text>`;
    if(pctV[i]!==null && tem[i]) s+=`<text x="${cx}" y="${H-7}" text-anchor="middle" style="fill:${pctV[i]>0.5?'var(--neg)':'var(--rd-desp)'};font-weight:700;font-size:${N>12?9:11}px">${(pctV[i]*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}%</text>`; }
  return s+'</svg>';
}
function niceStep(max){ const raw=max/4; const p=Math.pow(10,Math.floor(Math.log10(raw))); const n=raw/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function abrev(v){ return v>=1e6?(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi':v>=1e3?(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':String(Math.round(v)); }

function filtrarLanc(t){
  const f=F[t], q=norm(f.q);
  return S.lancamentos.filter(l=>{
    if(l.tipo!==t) return false; const s=stL(l);
    if(f.status!=='todos' && s!==f.status) return false;
    if(f.status!=='vencido' && f.periodo!=='todos'){ if(f.de && l.vencimento<f.de) return false; if(f.ate && l.vencimento>f.ate) return false; }
    if(f.contas && f.contas.length){ const sel=new Set(f.contas); if(!partes(l).some(p=>sel.has(p.contaId))) return false; }
    if(!passaMulti(f,l)) return false;
    if(f.incDe || f.incAte){ const d=(l.criadoEm||'').slice(0,10); if(!d) return false; if(f.incDe && d<f.incDe) return false; if(f.incAte && d>f.incAte) return false; }
    if(q && !norm([nomePessoa(l),l.pessoaNome,l.descricao,l.documento,l.boleto,String(l.valor).replace('.',','),fmoney(l.valor),nomeContaL(l),partes(l).map(p=>nomeConta(p.contaId)).join(' '),l.obs].join(' ')).includes(q)) return false;
    return true;
  }).sort((a,b)=>a.vencimento.localeCompare(b.vencimento) || nomePessoa(a).localeCompare(nomePessoa(b)));
}

}

  if(!o.uf){ const m=o.cidade.match(/^(.*?)\s*[\/-]\s*([A-Za-z]{2})(\s*·.*)?$/); if(m && UFS.includes(m[2].toUpperCase())){ o.cidade=m[1].trim(); o.uf=m[2].toUpperCase(); } }

ACT.novaConta=el=>{ const g=grupo(el.dataset.g); pedirConta('Nova conta em '+g.nome, g, null, (n,cl)=>{ const c={id:'c'+uid(), nome:n, ativo:true}; if(cl!==undefined) c.classe=cl; g.contas.push(c); }); };
ACT.renConta=el=>{ const g=grupo(el.dataset.g), c=g.contas.find(x=>x.id===el.dataset.c); pedirConta('Editar conta', g, c, (n,cl)=>{ c.nome=n; if(cl!==undefined) c.classe=cl; }); };
ACT.atvConta=el=>{ const c=grupo(el.dataset.g).contas.find(x=>x.id===el.dataset.c); c.ativo=c.ativo===false; salvarDoc('plano'); render(); toast(c.ativo?'Conta reativada':'Conta desativada: some das listas de lançamento, mas segue no histórico'); };
function usoConta(id){ let n=0; S.lancamentos.forEach(l=>partes(l).forEach(p=>{ if(p.contaId===id) n++; })); const ins=S.insumos.filter(i=>i.contaId===id).length; return {lanc:n, ins}; }
ACT.delConta=el=>{ const g=grupo(el.dataset.g), c=g.contas.find(x=>x.id===el.dataset.c); const u=usoConta(c.id);

  confirmar('Excluir conta', `Excluir a conta <b>${esc(c.nome)}</b> do grupo ${esc(g.nome)}?${u.ins?` ${u.ins} insumo(s) usam esta categoria e vão ficar sem categoria.`:''}`, 'Excluir conta', ()=>{ g.contas=g.contas.filter(x=>x.id!==c.id); S.insumos.forEach(i=>{ if(i.contaId===c.id){ i.contaId=''; touch(i); } }); if(u.ins) salvarCol('insumos'); salvarDoc('plano'); toast('Conta excluída'); }); };
ACT.delGrupo=el=>{ const g=grupo(el.dataset.g); const usadas=g.contas.filter(c=>usoConta(c.id).lanc);
  if(usadas.length){ toast(`O grupo "${g.nome}" tem contas com lançamentos (${usadas.map(c=>c.nome).slice(0,3).join(', ')}${usadas.length>3?'…':''}) e não pode ser excluído.`); return; }

  confirmar('Excluir grupo', `Excluir o grupo <b>${esc(g.nome)}</b>${g.contas.length?` e as ${g.contas.length} conta(s) dele`:''}? Esta linha some do DRE.`, 'Excluir grupo', ()=>{ const ids=new Set(g.contas.map(c=>c.id)); S.plano.grupos=S.plano.grupos.filter(x=>x!==g); S.insumos.forEach(i=>{ if(ids.has(i.contaId)){ i.contaId=''; touch(i); } }); salvarCol('insumos'); salvarDoc('plano'); toast('Grupo excluído'); }); };

/* ======================= NOTAS DE COMPRA E INSUMOS ======================= */
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const soDig=s=>String(s||'').replace(/\D/g,'');
function fmtDoc(d){ d=soDig(d); if(d.length===14) return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'); if(d.length===11) return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4'); return d; }
const REGRAS_CAT=[
  [/FITA|ESTOPA|PINCEL|PANO|DESENGRAX|PAPEL MASC|MASCARAMENTO/,'Tintas + materiais','Materiais de consumo (fitas, estopas, pincéis)'],
  [/LIXA/,'Peças','Lixas'], [/PARAFUSO/,'Peças','Parafusos'],
  [/VERNIZ/,'Tintas + materiais','Verniz'], [/PRIMER/,'Tintas + materiais','Primer'], [/MASSA/,'Tintas + materiais','Massa poliéster'],
  [/THINNER/,'Tintas + materiais','Thinner'], [/DILUENTE|QUEROSENE|SOLVENTE|REDUTOR/,'Tintas + materiais','Diluente'],
  [/ENDURECEDOR|CATALI[SZ]ADOR/,'Tintas + materiais','Catalisador'],
  [/PRETO/,'Tintas + materiais','Preto'], [/BRANCO/,'Tintas + materiais','Branco'], [/PRATA/,'Tintas + materiais','Prata'],
  [/VERMELHO/,'Tintas + materiais','Vermelho'], [/AZUL/,'Tintas + materiais','Azul'], [/VERDE/,'Tintas + materiais','Verde']
];
function contaPorNome(grupoNome, contaNome){ const g=S.plano.grupos.find(x=>norm(x.nome)===norm(grupoNome)); if(!g) return null; const c=g.contas.find(x=>norm(x.nome)===norm(contaNome)); return c?c.id:null; }
function catRef(grupoNome, contaNome){ return contaPorNome(grupoNome,contaNome) || ('new:'+grupoNome+'|'+contaNome); }
function chaveInsumo(fornId, desc){ return (fornId||'')+'#'+norm(desc); }
function adivinharCat(desc, fornId){
  const ins=S.insumos.find(i=>chaveInsumo(i.fornecedorId,i.descricao)===chaveInsumo(fornId,desc)); if(ins && ins.contaId) return ins.contaId;
  const d=norm(desc); for(const [re,g,c] of REGRAS_CAT){ if(re.test(d)) return catRef(g,c); } return catRef('Tintas + materiais','Outros');
}
function nomeCat(ref){ if(String(ref).startsWith('new:')){ const [g,c]=ref.slice(4).split('|'); return g+' › '+c+' (nova)'; } return nomeConta(ref); }
function catOptions(sel, extras){
  let h=`<option value="">Escolha</option>`;
  const novos=[...new Set((extras||[]).filter(r=>String(r).startsWith('new:')))];
  if(novos.length) h+=`<optgroup label="Contas novas (criadas ao salvar)">${novos.map(r=>`<option value="${esc(r)}"${r===sel?' selected':''}>${esc(nomeCat(r))}</option>`).join('')}</optgroup>`;
  return h+contasOptions('P', sel);
}
function partesValor(itens,total){
  const by={}; itens.forEach(it=>{ by[it.cat]=(by[it.cat]||0)+it.vTotal; }); const soma=itens.reduce((a,i)=>a+i.vTotal,0)||1;
  return Object.keys(by).map(k=>({contaId:k, valor:by[k]*total/soma}));
}
function arredondaPartes(ps,total){ const r=ps.map(p=>({contaId:p.contaId, valor:Math.round(p.valor*100)/100})); const dif=Math.round((total-r.reduce((a,p)=>a+p.valor,0))*100)/100; if(r.length && dif){ r.sort((a,b)=>b.valor-a.valor)[0].valor=Math.round((r[0].valor+dif)*100)/100; } return r; }

/* Leitura do XML da NF-e e do arquivo de nota */
function lerXmlNFe(txt){
  const doc=new DOMParser().parseFromString(txt,'application/xml');
  const inf=doc.getElementsByTagName('infNFe')[0]; if(!inf) throw new Error('xml');
  const q=(el,tag)=>{ if(!el) return ''; const x=el.getElementsByTagName(tag)[0]; return x?x.textContent.trim():''; };
  const emit=inf.getElementsByTagName('emit')[0], ide=inf.getElementsByTagName('ide')[0], tot=inf.getElementsByTagName('ICMSTot')[0];
  return { fornecedor:{ nome:q(emit,'xNome'), doc:fmtDoc(q(emit,'CNPJ')||q(emit,'CPF')), fone:q(emit,'fone'), ie:q(emit,'IE'),
      endereco:q(emit,'xLgr'), numero:[q(emit,'nro'),q(emit,'xCpl')].filter(Boolean).join(' '), bairro:q(emit,'xBairro'), cep:fmtCep(q(emit,'CEP')), cidade:q(emit,'xMun'), uf:q(emit,'UF'), fantasia:q(emit,'xFant') },
    numero:String(+q(ide,'nNF')||q(ide,'nNF')), serie:q(ide,'serie'), emissao:(q(ide,'dhEmi')||q(ide,'dEmi')).slice(0,10), chave:(inf.getAttribute('Id')||'').replace(/^NFe/,''),
    itens:[...inf.getElementsByTagName('det')].map(d=>{ const p=d.getElementsByTagName('prod')[0]; return {codigo:q(p,'cProd'), descricao:q(p,'xProd'), ncm:q(p,'NCM'), un:q(p,'uCom'), qtd:+q(p,'qCom')||0, vUnit:+q(p,'vUnCom')||0, vTotal:+q(p,'vProd')||0}; }),
    duplicatas:[...inf.getElementsByTagName('dup')].map(d=>({numero:q(d,'nDup'), venc:q(d,'dVenc'), valor:+q(d,'vDup')||0})),
    total:+q(tot,'vNF')||0 };
}
/* Conversão na entrada: quanto de kg, L ou m vem em 1 unidade comprada */
function insumoPorDesc(fid, desc){ const k=chaveInsumo(fid,desc); return S.insumos.find(i=>chaveInsumo(i.fornecedorId,i.descricao)===k) || (desc? S.insumos.find(i=>norm(i.descricao)===norm(desc)) : null); }
function medidaUn(un){ const u=norm(un).replace(/\./g,'');
  if(/^(KG|KGS|QUILO|QUILOS)$/.test(u)) return {q:1,u:'kg'}; if(/^(G|GR|GRS|GRAMA|GRAMAS)$/.test(u)) return {q:0.001,u:'kg'};
  if(/^(L|LT|LTS|LITRO|LITROS)$/.test(u)) return {q:1,u:'L'}; if(u==='ML') return {q:0.001,u:'L'};
  if(/^(M|MT|MTS|METRO|METROS)$/.test(u)) return {q:1,u:'m'}; return null; }
function aplicarMedida(x, fid, forcar){
  if(!forcar && x.conteudo>0 && x.base) return false;
  const ins=insumoPorDesc(fid,x.descricao); let md=null, auto=false;
  if(ins && ins.conteudo>0 && ins.base) md={q:+ins.conteudo,u:ins.base};
  if(!md) md=medidaUn(x.un);
  if(!md){ md=conteudoDaDescricao(x.descricao); auto=!!md; }
  if(!md){ if(forcar){ x.conteudo=0; x.base='kg'; x.medAuto=false; } else if(!x.base) x.base='kg'; return false; }
  x.conteudo=md.q; x.base=md.u; x.medAuto=auto; return true;
}
function pbTxt(it){ const q=+it.conteudo, u=it.base, qt=+it.qtd, v=+it.vTotal;
  if(!(q>0) || !u || (u==='un' && q===1) || !(qt>0) || !(v>0)) return '<span class="hint">—</span>';
  return `<b>${brl(v/(qt*q))}</b> /${u}<div class="cell-sub">${fnum(qt)} × ${fQtd(q,u)} = ${fQtd(qt*q,u)}</div>`; }
function pbItemNota(i){ const md=(i.conteudo>0&&i.base)?{q:+i.conteudo,u:i.base}:medidaIns(S.insumos.find(x=>x.id===i.insumoId));
  return md? pbTxt({conteudo:md.q, base:md.u, qtd:i.qtd, vTotal:i.vTotal}) : '<span class="hint">—</span>'; }
function prepararRascunho(d){
  const forn=S.fornecedores.find(f=>(d.fornecedor.doc && soDig(f.doc)===soDig(d.fornecedor.doc)) || norm(f.nome)===norm(d.fornecedor.nome));
  const fid=forn?forn.id:'';
  d.itens=(d.itens||[]).map(it=>{ const x=Object.assign({codigo:'',ncm:'',un:'UN'},it); x.qtd=+x.qtd||0; x.vUnit=+x.vUnit||0; x.vTotal=Math.round((+x.vTotal||x.qtd*x.vUnit)*100)/100;
    x.cat = x.categoria&&x.categoria.grupo ? catRef(x.categoria.grupo,x.categoria.conta) : (x.cat||adivinharCat(x.descricao,fid)); delete x.categoria; aplicarMedida(x,fid); return x; });
  d.duplicatas=(d.duplicatas||[]).map(x=>({numero:String(x.numero||''), venc:x.venc||'', valor:+x.valor||0}));
  if(!d.total) d.total=Math.round(d.itens.reduce((a,i)=>a+i.vTotal,0)*100)/100;
  d.forma=d.forma||'Boleto'; return d;
}

/* Entrada de notas (pelo Contas a pagar) */
ACT.novaNota=()=>formNota(prepararRascunho({fornecedor:{nome:''}, numero:'', serie:'', emissao:hoje(), itens:[{descricao:'',qtd:1,un:'UN',vUnit:0}], duplicatas:[], total:0}));
CHG.importarNota=el=>{ const f=el.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const txt=String(r.result); let d;
      if(/^\s*\{/.test(txt)){ d=JSON.parse(txt); if(d.tipo!=='nota-compra') throw 0; } else d=lerXmlNFe(txt);
      formNota(prepararRascunho(d)); toast('Confira os itens e as categorias antes de salvar.'); }
    catch(e){ toast('Não consegui ler esse arquivo. Use o XML da NF-e ou um arquivo de nota gerado para este ERP.'); } };
  r.readAsText(f); el.value=''; };

function completarItem(it, ND){
  const fx=ND.fornecedor||{}; const fo=S.fornecedores.find(f=>(fx.doc && soDig(f.doc)===soDig(fx.doc)) || norm(f.nome)===norm(fx.nome)); const fid=fo?fo.id:'';
  const ins=insumoPorDesc(fid,it.descricao);
  if(ins){ it.un=ins.un||it.un; if(ins.contaId) it.cat=ins.contaId; it.codigo=ins.codigo||it.codigo; it.ncm=ins.ncm||it.ncm;
    if(!(it.vUnit>0) && ins.ultimoPreco){ it.vUnit=ins.ultimoPreco; it.vTotal=Math.round(it.qtd*it.vUnit*100)/100; }
    aplicarMedida(it,fid,true); return true; }
  let mudou=false; if(!it.cat && String(it.descricao).trim()){ it.cat=adivinharCat(it.descricao,fid); mudou=true; }
  if(!(it.conteudo>0) && aplicarMedida(it,fid)) mudou=true; return mudou;
}
function formNota(ND){

      ${avisos.map(a=>`<div class="warnbox">${a}</div>`).join('')}
      <div><b style="font-size:13px">Resumo por categoria</b>${Object.keys(cats).sort((a,b)=>cats[b]-cats[a]).map(k=>`<div class="hbar"><span>${esc(nomeCat(k))}</span><div class="tr"><i style="width:${(cats[k]/(ti||1)*100).toFixed(1)}%"></i></div><b>${brl(cats[k])}</b></div>`).join('')}</div>`; };
  const corpo=()=>{ const fx=ND.fornecedor||{};
    return `<div class="fields">
      <div class="f s4"><label for="nfForn">Fornecedor *</label><input id="nfForn" list="nfForns" value="${esc(fx.nome||'')}" data-nd="fornecedor.nome" autocomplete="off"><datalist id="nfForns">${S.fornecedores.map(f=>`<option value="${esc(f.nome)}">`).join('')}</datalist></div>
      <div class="f s2"><label for="nfDoc">CNPJ / CPF</label><input id="nfDoc" value="${esc(fx.doc||'')}" data-nd="fornecedor.doc"></div>
      <div class="f s2"><label for="nfNum">Nº da nota *</label><input id="nfNum" value="${esc(ND.numero)}" data-nd="numero" inputmode="numeric"></div>
      <div class="f s2"><label for="nfSerie">Série</label><input id="nfSerie" value="${esc(ND.serie||'')}" data-nd="serie"></div>
      <div class="f s2"><label for="nfEmi">Emissão *</label><input id="nfEmi" type="date" value="${ND.emissao||''}" data-nd="emissao"></div>
      <div class="f s2"><label for="nfTot">Valor total da nota (R$)</label><input id="nfTot" class="n" inputmode="decimal" value="${fmoneyIn(ND.total)}" data-nd="total" data-num="1"></div>
      <div class="f s2"><label for="nfForma">Forma de pagamento</label><select id="nfForma" data-nd="forma">${formaOptions(ND.forma,'P')}</select></div>
      <div class="f s2"><label for="nfChave">Chave de acesso</label><input id="nfChave" value="${esc(ND.chave||'')}" data-nd="chave"></div>
    </div>
    <div><div class="card-h" style="margin:6px 0"><h2 style="font-size:18px">Itens</h2><button class="btn sm primary" data-m="addItem">+ Item</button></div>
    <p class="note" style="margin:0 0 8px">"1 un contém": quanto de kg, litro ou metro vem em cada unidade comprada (ex.: galão de 3,6 L, lata de 900 ml = 0,9 L). O ERP preenche pela unidade da nota, pelo cadastro do insumo ou pela descrição; confira e corrija se precisar. Item já cadastrado: comece a digitar a descrição e escolha na lista.</p>
    <datalist id="nfInsList">${[...new Set(S.insumos.map(i=>i.descricao))].map(d=>`<option value="${esc(d)}">`).join('')}</datalist>
    <div class="tscroll"><table class="t"><thead><tr><th>Descrição</th><th class="r">Qtd</th><th>Un</th><th>1 un contém</th><th class="r">Unitário</th><th class="r">Total</th><th class="r">Preço kg / L</th><th>Categoria</th><th></th></tr></thead><tbody>
    ${ND.itens.map((it,i)=>`<tr><td style="min-width:220px"><input value="${esc(it.descricao)}" data-ni="${i}" data-k="descricao" list="nfInsList" autocomplete="off" aria-label="Descrição item ${i+1}">${it.codigo?`<div class="cell-sub">cód. ${esc(it.codigo)}${it.ncm?' · NCM '+esc(it.ncm):''}</div>`:''}</td>

function salvarNota(ND){
  const fx=ND.fornecedor||{}; const nome=String(fx.nome||'').trim();
  if(!nome){ toast('Informe o fornecedor.'); return; } if(!String(ND.numero).trim()){ toast('Informe o número da nota.'); return; } if(!ND.emissao){ toast('Informe a data de emissão.'); return; }
  const itens=ND.itens.filter(i=>String(i.descricao).trim() && i.vTotal>0); if(!itens.length){ toast('Inclua pelo menos um item com valor.'); return; }
  if(itens.some(i=>!i.cat)){ toast('Escolha a categoria de todos os itens.'); return; }
  const total=Math.round((+ND.total||itens.reduce((a,i)=>a+i.vTotal,0))*100)/100;
  if(ND.duplicatas.length && Math.abs(ND.duplicatas.reduce((a,d)=>a+d.valor,0)-total)>0.009){ toast('A soma das duplicatas precisa ser igual ao total da nota.'); return; }
  if(ND.duplicatas.some(d=>!d.venc||!(d.valor>0))){ toast('Preencha vencimento e valor de todas as duplicatas.'); return; }
  // fornecedor
  let f=S.fornecedores.find(x=>(fx.doc && soDig(x.doc)===soDig(fx.doc)) || norm(x.nome)===norm(nome));
  if(!f){ f=touch({id:uid(), nome}); S.fornecedores.push(f); }
  ['doc','fone','celular','endereco','numero','bairro','cep','cidade','uf','ie','fantasia'].forEach(k=>{ if(fx[k] && !f[k]) f[k]=fx[k]; }); touch(f);
  if(S.notas.some(n=>n.fornecedorId===f.id && String(+n.numero||n.numero)===String(+ND.numero||ND.numero))){ toast(`A nota ${ND.numero} de ${f.nome} já foi lançada.`); return; }
  // contas novas
  const mapa={}; itens.forEach(i=>{ if(String(i.cat).startsWith('new:') && !mapa[i.cat]){ const [gn,cn]=i.cat.slice(4).split('|'); let g=S.plano.grupos.find(x=>norm(x.nome)===norm(gn)); if(!g){ g={id:'g'+uid(), secao:'csv', nome:gn, insumo:true, contas:[]}; S.plano.grupos.push(g); } let c=g.contas.find(x=>norm(x.nome)===norm(cn)); if(!c){ c={id:'c'+uid(), nome:cn, ativo:true}; g.contas.push(c); } mapa[i.cat]=c.id; } });
  if(Object.keys(mapa).length){ salvarDoc('plano'); }
  itens.forEach(i=>{ if(mapa[i.cat]) i.cat=mapa[i.cat]; });
  // insumos (o mesmo item em mais de uma linha da nota é somado)
  const somaNota={};
  itens.forEach(i=>{ const k=chaveInsumo(f.id,i.descricao); let ins=S.insumos.find(x=>chaveInsumo(x.fornecedorId,x.descricao)===k);
    if(!ins){ const md=conteudoDaDescricao(i.descricao); ins={id:uid(), fornecedorId:f.id, descricao:String(i.descricao).trim(), codigo:i.codigo||'', ncm:i.ncm||'', un:i.un||'UN', contaId:i.cat}; if(md){ ins.conteudo=md.q; ins.base=md.u; } S.insumos.push(ins); }
    const ac=somaNota[ins.id]=somaNota[ins.id]||{qtd:0,tot:0}; ac.qtd+=i.qtd; ac.tot+=i.vTotal;
    if(!ins.ultimaCompra || ND.emissao>=ins.ultimaCompra){ ins.ultimaQtd=ac.qtd; ins.ultimoTotal=Math.round(ac.tot*100)/100; ins.ultimoPreco=Math.round(ac.tot/(ac.qtd||1)*100)/100; ins.ultimaCompra=ND.emissao; ins.un=i.un||ins.un; }
    if(i.conteudo>0 && i.base){ ins.conteudo=+i.conteudo; ins.base=i.base; }
    ins.contaId=i.cat; touch(ins); i.insumoId=ins.id; });
  // contas a pagar com rateio
  const partes0=partesValor(itens,total); const dups=ND.duplicatas.length?ND.duplicatas:[{numero:'',venc:ND.emissao,valor:total}];
  const notaId=uid(), lancIds=[];
  dups.forEach((d,i)=>{ const rat=arredondaPartes(partes0.map(p=>({contaId:p.contaId, valor:p.valor*d.valor/total})), d.valor);
    const princ=rat.slice().sort((a,b)=>b.valor-a.valor)[0];
    const l=touch({id:uid(), tipo:'P', pessoaId:f.id, pessoaNome:f.nome, descricao:`NF ${ND.numero} · compra de insumos`, documento:`NF ${ND.numero}${d.numero?' / dup '+d.numero:''}`,
      contaId:princ.contaId, rateio:rat, competencia:ND.emissao, vencimento:d.venc, valor:d.valor, forma:ND.forma||'Boleto', boleto:'', obs:'', parcela:dups.length>1?(i+1)+'/'+dups.length:'', grupoParcelas:dups.length>1?notaId:'', status:'aberto', notaId});
    if(!ND.duplicatas.length && ND.pago){ l.status='pago'; l.pagamento={data:ND.emissao, valor:d.valor, juros:0, desconto:0, bancoId:S.bancos.itens[0]?S.bancos.itens[0].id:'', forma:ND.forma}; }
    S.lancamentos.push(l); lancIds.push(l.id); });
  S.notas.push(touch({id:notaId, fornecedorId:f.id, fornecedorNome:f.nome, numero:String(ND.numero).trim(), serie:ND.serie||'', emissao:ND.emissao, chave:ND.chave||'', total, forma:ND.forma,
    itens:itens.map(i=>({codigo:i.codigo||'', descricao:String(i.descricao).trim(), ncm:i.ncm||'', un:i.un, qtd:i.qtd, vUnit:i.vUnit, vTotal:i.vTotal, contaId:i.cat, insumoId:i.insumoId, conteudo:+i.conteudo||0, base:i.conteudo>0?i.base:''})),
    duplicatas:dups.map(d=>({numero:d.numero, venc:d.venc, valor:d.valor})), lancIds}));
  ['fornecedores','insumos','lancamentos','notas'].forEach(salvarCol);
  fecharModal(); toast(`Nota ${ND.numero} salva: ${itens.length} itens e ${dups.length} conta(s) a pagar`);
}

const BASES=[['kg','kg (quilo)'],['L','L (litro)'],['m','m (metro)'],['un','un (unidade)']];
function conteudoDaDescricao(desc){
  const d=norm(desc).replace(/(\d),(\d)/g,'$1.$2'); const re=/(\d+(?:\.\d+)?)\s*(KGS?|GRS?|G|ML|LTS?|LITROS?|L|MTS?|M)\b/g; let m, ult=null;
  while((m=re.exec(d))) ult=m; if(!ult) return null; const q=parseFloat(ult[1]), u=ult[2]; if(!(q>0)) return null;
  if(/^KG/.test(u)) return {q, u:'kg'}; if(/^G/.test(u)) return {q:q/1000, u:'kg'}; if(u==='ML') return {q:q/1000, u:'L'};
  if(/^L/.test(u)) return {q, u:'L'}; return {q, u:'m'};
}
function medidaIns(i){ if(!i) return null; if(i.conteudo>0 && i.base) return {q:+i.conteudo, u:i.base, auto:false}; const p=conteudoDaDescricao(i.descricao); return p? Object.assign(p,{auto:true}) : null; }
function fQtd(q,u){ if(u==='kg' && q<1) return fnum(q*1000)+' g'; if(u==='L' && q<1) return fnum(q*1000)+' ml'; return fnum(q)+' '+u; }

/* Cada relatório monta uma tabela única {titulo, filtros, cols, linhas}; o PDF (jsPDF) e o Excel (ExcelJS) saem dela. */
const LIBS={
  pdf:[['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'],
       ['https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js','https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js']],
  xlsx:[['https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js','https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js']]
};
const _libOk={};
function carregarScript(urls){ return new Promise((ok,erro)=>{ let i=0; const tenta=()=>{ if(i>=urls.length){ erro(new Error('lib')); return; } const s=document.createElement('script'); s.src=urls[i++]; s.onload=()=>ok(); s.onerror=()=>{ s.remove(); tenta(); }; document.head.appendChild(s); }; tenta(); }); }
async function carregarLibs(fmt){ if(_libOk[fmt]) return; for(const urls of LIBS[fmt]) await carregarScript(urls); _libOk[fmt]=true; }

const REL_EXP={};   /* chave -> função que devolve a tabela do relatório como está na tela */
const botoesExp=(k,extra)=>`<div class="row" style="gap:6px">${extra||''}<button type="button" class="btn sm" data-act="exp" data-k="${k}" data-f="pdf"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>PDF</button><button type="button" class="btn sm" data-act="exp" data-k="${k}" data-f="xlsx"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>Excel</button></div>`;
ACT.exp=async el=>{ const k=el.dataset.k, fmt=el.dataset.f; const R=REL_EXP[k]&&REL_EXP[k](); if(!R) return;
  if(!R.linhas.length){ toast('Não há dados neste filtro para exportar.'); return; }
  const txt=el.innerHTML; el.disabled=true; el.textContent='Gerando…';
  try{ await carregarLibs(fmt); const blob= fmt==='pdf'? gerarPDF(R) : await gerarXLSX(R);
    const nome=(R.arquivo||R.titulo).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w-]+/g,'_').replace(/_+/g,'_')+'.'+fmt;
    if(await baixar(blob,nome)) toast(fmt==='pdf'?'PDF gerado':'Planilha Excel gerada'); }
  catch(e){ console.error(e); toast(e&&e.message==='lib'?'Sem internet para gerar o arquivo agora. Conecte e tente de novo.':'Não consegui gerar o arquivo.'); }
  finally{ el.disabled=false; el.innerHTML=txt; } };

function fmtCel(v,tipo){ if(v===''||v===null||v===undefined) return ''; if(typeof v!=='number') return String(v);
  if(tipo==='moeda') return fmoney(v); if(tipo==='pct') return pct(v); if(tipo==='int') return String(Math.round(v)); if(tipo==='num') return fnum(v,3); return String(v); }
function cabEmpresa(){ const e=S.cfg.empresa||{}; return {nome:e.nome||'Truckcar Centro Automotivo', linha:[e.cnpj?'CNPJ '+e.cnpj:'', e.cidade||''].filter(Boolean).join(' · ')}; }
function dataHoraAgora(){ const d=new Date(); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }

function gerarPDF(R){
  const {jsPDF}=window.jspdf; const larg=R.paisagem||R.cols.length>6;
  const doc=new jsPDF({orientation:larg?'landscape':'portrait', unit:'mm', format:'a4'}); const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
  const emp=cabEmpresa(), logo=S.logo||LOGO, NAVY=[24,35,58], TEAL=[30,111,115], CINZA=[86,101,118];
  const topo=()=>{ try{ const p=doc.getImageProperties(logo); const h=14, w=Math.min(34,p.width*h/p.height); doc.addImage(logo, logo.startsWith('data:image/png')?'PNG':'JPEG', 12, 8, w, h); }catch(e){}
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...NAVY); doc.text(emp.nome, W-12, 12, {align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...CINZA); if(emp.linha) doc.text(emp.linha, W-12, 16.5, {align:'right'});
    doc.setDrawColor(...TEAL); doc.setLineWidth(.6); doc.line(12, 25, W-12, 25);
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(...NAVY); doc.text(R.titulo.toUpperCase(), 12, 33);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...CINZA); const f=doc.splitTextToSize((R.filtros||[]).join('   ·   '), W-24); doc.text(f, 12, 38.5); return 38.5+f.length*3.6+2; };
  const y0=topo();
  const al=R.cols.map(c=>c.tipo&&c.tipo!=='txt'?'right':'left');
  doc.autoTable({ startY:y0, margin:{top:y0, left:12, right:12, bottom:16}, theme:'plain',
    head:[R.cols.map(c=>c.t)], body:R.linhas.map(l=>{ const c=l.v.map((v,i)=>fmtCel(v,R.cols[i].tipo).replace(/[\u2212\u2013]/g,'-')); return l.span? [{content:c[0], colSpan:l.span}, ...c.slice(l.span)] : c; }),
    styles:{font:'helvetica', fontSize:larg&&R.cols.length>10?7:8.3, cellPadding:{top:1.6,bottom:1.6,left:2,right:2}, textColor:[24,35,58], lineColor:[208,216,222], lineWidth:{bottom:.15}, overflow:'linebreak'},
    headStyles:{fillColor:NAVY, textColor:255, fontStyle:'bold', fontSize:7.6, lineWidth:0},
    columnStyles:Object.fromEntries(R.cols.map((c,i)=>[i,{halign:al[i], cellWidth:c.w||'auto'}])),
    didParseCell:d=>{ if(d.section==='head'){ d.cell.styles.halign=al[d.column.index]; return; } if(d.section!=='body') return; const l=R.linhas[d.row.index];
      if(d.column.index===0 && l.nivel) d.cell.styles.cellPadding={top:1.6,bottom:1.6,right:2,left:2+l.nivel*5};
      if(l.estilo==='secao'){ d.cell.styles.fillColor=[223,240,240]; d.cell.styles.fontStyle='bold'; d.cell.styles.textColor=TEAL; }
      if(l.estilo==='grupo'){ d.cell.styles.fillColor=[244,247,248]; d.cell.styles.fontStyle='bold'; }
      if(l.estilo==='det'){ d.cell.styles.textColor=CINZA; d.cell.styles.fontSize=7.4; }
      if(l.estilo==='off'){ d.cell.styles.textColor=[150,160,170]; }
      if(l.estilo==='total'){ d.cell.styles.fillColor=[24,35,58]; d.cell.styles.textColor=255; d.cell.styles.fontStyle='bold'; } },
    didDrawPage:()=>{ if(doc.internal.getCurrentPageInfo().pageNumber>1) topo(); } });
  const n=doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...CINZA); doc.setDrawColor(208,216,222); doc.setLineWidth(.2); doc.line(12,H-11,W-12,H-11);
    doc.text('ERP Truckcar · gerado em '+dataHoraAgora(), 12, H-7); doc.text('Página '+i+' de '+n, W-12, H-7, {align:'right'}); }
  return doc.output('blob');
}

async function gerarXLSX(R){
  const wb=new ExcelJS.Workbook(); wb.creator='ERP Truckcar'; wb.created=new Date();
  const nomeAba=R.titulo.replace(/[\\/?*[\]:]/g,'').slice(0,31);
  const ws=wb.addWorksheet(nomeAba,{views:[{state:'frozen', ySplit:5}], pageSetup:{orientation:(R.paisagem||R.cols.length>6)?'landscape':'portrait', fitToPage:true, fitToWidth:1, fitToHeight:0, paperSize:9, margins:{left:.4,right:.4,top:.5,bottom:.5,header:.2,footer:.2}}});
  const nc=R.cols.length, emp=cabEmpresa(), NAVY='FF18233A', TEAL='FF1E6F73';
  ws.mergeCells(1,1,1,nc); ws.getCell(1,1).value=emp.nome+(emp.linha?'  ·  '+emp.linha:''); ws.getCell(1,1).font={bold:true, size:10, color:{argb:'FF566576'}};
  ws.mergeCells(2,1,2,nc); ws.getCell(2,1).value=R.titulo.toUpperCase(); ws.getCell(2,1).font={bold:true, size:15, color:{argb:NAVY}};
  ws.mergeCells(3,1,3,nc); ws.getCell(3,1).value=(R.filtros||[]).join('   ·   ')+'   ·   gerado em '+dataHoraAgora(); ws.getCell(3,1).font={size:9, color:{argb:'FF566576'}};
  ws.getRow(2).height=22;
  const hr=ws.getRow(5); R.cols.forEach((c,i)=>{ const x=hr.getCell(i+1); x.value=c.t; x.font={bold:true,color:{argb:'FFFFFFFF'},size:10}; x.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}}; x.alignment={horizontal:c.tipo&&c.tipo!=='txt'?'right':'left', vertical:'middle', wrapText:true}; }); hr.height=20;
  const FMT={moeda:'#,##0.00;[Red]-#,##0.00', pct:'0.0%', int:'0', num:'#,##0.###'};
  R.linhas.forEach((l,ri)=>{ const row=ws.getRow(6+ri);
    l.v.forEach((v,i)=>{ const c=row.getCell(i+1), tipo=R.cols[i].tipo; c.value=(v===''||v===null||v===undefined)?null:v; if(typeof v==='number' && FMT[tipo]) c.numFmt=FMT[tipo];
      c.alignment={horizontal:tipo&&tipo!=='txt'?'right':'left', vertical:'top', indent:i===0&&l.nivel?l.nivel*2:0, wrapText:i===0};
      const fonte={size:10, color:{argb:'FF18233A'}};
      if(l.estilo==='secao'){ fonte.bold=true; fonte.color={argb:TEAL}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFDFF0F0'}}; }
      if(l.estilo==='grupo'){ fonte.bold=true; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF4F7F8'}}; }
      if(l.estilo==='det'||l.estilo==='off'){ fonte.color={argb:'FF7A8796'}; fonte.size=9; }
      if(l.estilo==='total'){ fonte.bold=true; c.border={top:{style:'medium',color:{argb:NAVY}}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFDFF0F0'}}; }
      c.font=fonte; if(l.estilo!=='total') c.border={bottom:{style:'hair',color:{argb:'FFD0D8DE'}}}; }); });
  R.cols.forEach((c,i)=>{ let w=c.t.length; R.linhas.forEach(l=>{ const s=fmtCel(l.v[i],c.tipo); w=Math.max(w, Math.min(60, s.length+(i===0&&l.nivel?l.nivel*2:0))); }); ws.getColumn(i+1).width=Math.max(i===0?18:9, w+2); });
  ws.headerFooter.oddFooter='&L&8ERP Truckcar · '+R.titulo+'&R&8Página &P de &N';
  ws.pageSetup.printTitlesRow='5:5';
  const buf=await wb.xlsx.writeBuffer(); return new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/* ======================= CLASSIFICAÇÃO DE CUSTOS E PONTO DE EQUILÍBRIO ======================= */
const CLASSES={fixa:'Despesa fixa', variavel:'Despesa variável', cmo:'CMO (mão de obra)', imposto:'Impostos', financeira:'Despesas financeiras'};
const CLASSE_CURTA={fixa:'Fixa', variavel:'Variável', cmo:'CMO', imposto:'Imposto', financeira:'Financeira', '':'Fora do PE'};
const TRAT_PADRAO={fixa:'F', variavel:'V', cmo:'F', imposto:'V', financeira:'V'};
function classePadrao(g){ if(!g) return ''; const n=norm(g.nome);
  if(g.secao==='perdas') return 'variavel';
  if(g.secao==='deducoes') return /IMPOST|TAXAS$/.test(n)&&!/FINANC|ANTECIP/.test(n)?'imposto': /FINANC|ANTECIP|CART/.test(n)?'financeira':'variavel';
  if(g.secao==='csv') return /MAO DE OBRA/.test(n)?'cmo':'variavel';
  if(g.secao==='desp_op') return 'fixa';
  if(g.secao==='fin_desp') return 'financeira';
  if(g.secao==='ir') return 'imposto';
  return ''; }
const classeDe=(c,g)=> c && c.classe!==undefined ? c.classe : classePadrao(g);
const classeOptions=sel=>Object.keys(CLASSES).map(k=>`<option value="${k}"${sel===k?' selected':''}>${CLASSES[k]}</option>`).join('')+`<option value=""${!sel?' selected':''}>Fora do ponto de equilíbrio</option>`;
const tratPE=()=>Object.assign({},TRAT_PADRAO,S.plano.peTrat||{});
CHG.classeConta=el=>{ const g=grupo(el.dataset.g), c=g&&g.contas.find(x=>x.id===el.dataset.c); if(!c) return; c.classe=el.value; salvarDoc('plano'); el.closest('li').querySelector('.cl-tag')?.setAttribute('data-cl',el.value); toast(`${c.nome}: ${el.value?CLASSES[el.value]:'fora do ponto de equilíbrio'}`); };
CHG.classeGrupo=el=>{ if(el.value==='_') return; const g=grupo(el.dataset.g); if(!g) return; const v=el.value==='_fora'?'':el.value; g.contas.forEach(c=>c.classe=v); salvarDoc('plano'); render(); toast(`Grupo ${g.nome}: todas as contas como ${v?CLASSES[v]:'fora do ponto de equilíbrio'}`); };

/* Cadastro de conta com classificação */
function pedirConta(titulo, g, c, ok){
  const comCl=SECOES[g.secao].nat==='P', cl=c?classeDe(c,g):classePadrao(g);
  abrirModal(titulo, `<div class="f"><label for="nNome">Nome da conta</label><input id="nNome" value="${esc(c?c.nome:'')}"></div>
    ${comCl?`<div class="f"><label for="nClasse">Classificação (para o ponto de equilíbrio)</label><select id="nClasse">${classeOptions(cl)}</select></div>
    <p class="note" style="margin:0">Fixa: não muda com o faturamento (aluguel, salários administrativos). Variável: sobe e desce com os serviços (tintas, materiais, frete). CMO: mão de obra dos serviços. Impostos e financeiras: incidem sobre as vendas (simples, ISS, taxas de cartão).</p>`:''}`,
    `<span></span><div class="row"><button class="btn" data-m="fechar">Cancelar</button><button class="btn primary" data-m="ok">Salvar</button></div>`,
    { ok:()=>{ const n=mv('nNome').trim(); if(!n){ toast('Informe o nome.'); return; } ok(n, comCl?mv('nClasse'):undefined); salvarDoc('plano'); fecharModal(); toast('Plano de contas atualizado'); } }, true); }

/* Cálculo */
F.peAno=new Date().getFullYear(); F.peP=novoPer();
function calcPE(ano, m0, m1){
  const V=valoresPorConta(ano), T=tratPE(), soma=a=>{ let s=0; for(let i=m0;i<=m1;i++) s+=a?a[i]:0; return s; };
  const aj=k=>{ let s=0; for(let i=m0;i<=m1;i++) s+=parseNum((S.ajustes[ano+'-'+pad(i+1)]||{})[k]); return s; };
  let rec=0; gruposDe('receita').forEach(g=>g.contas.forEach(c=>rec+=soma(V[c.id])));
  const cl={}; Object.keys(CLASSES).forEach(k=>cl[k]={tot:0, contas:[]}); let fora=0; const foraContas=[];
  ORDEM.filter(s=>SECOES[s].nat==='P').forEach(s=>gruposDe(s).forEach(g=>g.contas.forEach(c=>{ const v=soma(V[c.id]); if(!v) return; const k=classeDe(c,g);
    if(!k){ fora+=v; foraContas.push({nome:g.nome+' › '+c.nome, v}); return; } cl[k].tot+=v; cl[k].contas.push({nome:g.nome+' › '+c.nome, v, id:c.id}); })));
  const estoque=aj('ei')-aj('ef'); if(estoque){ cl.variavel.tot+=estoque; cl.variavel.contas.push({nome:'Variação de estoque (estoque inicial − final, do DRE)', v:estoque}); }
  let cv=0, cf=0; Object.keys(CLASSES).forEach(k=>{ if(T[k]==='V') cv+=cl[k].tot; else cf+=cl[k].tot; });
  const mc=rec-cv, mcp=rec?mc/rec:0, pe=mcp>0?cf/mcp:null, n=m1-m0+1;
  const meses=[]; for(let i=m0;i<=m1;i++) if(ativos().some(l=>l.competencia&&l.competencia.startsWith(ano+'-'+pad(i+1)))) meses.push(i);
  return {rec, cl, T, cv, cf, mc, mcp, pe, ms:pe!==null&&rec?(rec-pe)/rec:null, res:mc-cf, fora, foraContas, n, nMov:Math.max(1,meses.length)};
}

function vPE(){
  const ano=F.peAno, [m0,m1]=faixa(F.peP), R=calcPE(ano,m0,m1), T=R.T, rot=rotuloPer(F.peP,ano);

    <div class="tile ${R.ms===null?'':R.ms>=0?'pos':'neg'}"><small>Margem de segurança</small><b class="${R.ms<0?'neg-t':''}">${R.ms===null?'—':pct(R.ms)}</b><span>${R.ms===null?'':R.ms>=0?'quanto o faturamento pode cair sem prejuízo':'faltou faturar '+brl(R.pe-R.rec)}</span></div>
  </div>
  <div class="card" style="padding:0"><div class="tscroll"><table class="t"><thead><tr><th>Demonstração pela margem de contribuição · ${esc(rot)}</th><th class="r">Valor</th><th class="r">% do faturamento</th></tr></thead><tbody>
    <tr style="background:var(--surface-2)"><td class="cell-main">(+) Faturamento</td><td class="r"><b>${brl(R.rec)}</b></td><td class="r">100,0%</td></tr>
    <tr style="background:var(--surface-2)"><td class="cell-main">(−) Custos e despesas variáveis</td><td class="r"><b>${brl(R.cv)}</b></td><td class="r">${pct(R.rec?R.cv/R.rec:0)}</td></tr>
    ${vks.map(lin).join('')}
    <tr style="background:var(--accent-soft)"><td class="cell-main">(=) Margem de contribuição</td><td class="r"><b>${brl(R.mc)}</b></td><td class="r"><b>${pct(R.mcp)}</b></td></tr>
    <tr style="background:var(--surface-2)"><td class="cell-main">(−) Custos e despesas fixas</td><td class="r"><b>${brl(R.cf)}</b></td><td class="r">${pct(R.rec?R.cf/R.rec:0)}</td></tr>
    ${fks.map(lin).join('')}
    <tr style="background:var(--accent-soft)"><td class="cell-main">(=) Resultado operacional</td><td class="r"><b class="${R.res<0?'neg-t':''}">${brl(R.res)}</b></td><td class="r">${pct(R.rec?R.res/R.rec:0)}</td></tr>
  </tbody><tfoot><tr><td>Ponto de equilíbrio = custos fixos ÷ margem de contribuição % = ${brl(R.cf)} ÷ ${pct(R.mcp)}</td><td class="r">${R.pe===null?'—':brl(R.pe)}</td><td class="r">${R.pe===null||!R.rec?'':pct(R.pe/R.rec)}</td></tr></tfoot></table></div></div>
  ${R.pe!==null&&R.rec?graficoPE(R):''}
  ${R.fora?`<div class="card"><div class="card-h"><h2 style="font-size:17px">Fora do cálculo</h2><span class="hint">${brl(R.fora)} no período</span></div><p class="note">Contas classificadas como "fora do ponto de equilíbrio" (parcelamentos, distribuição de lucros, provisões). Para incluir alguma, mude a classificação dela no Plano de contas.</p>
    <div class="cell-sub" style="margin-top:6px">${R.foraContas.sort((a,b)=>b.v-a.v).map(x=>esc(x.nome)+': '+brl(x.v)).join(' · ')}</div></div>`:''}
  `}

}

/* Gráfico clássico: receita × custo total, cruzando no ponto de equilíbrio */
function graficoPE(R){
  const W=760, H=300, pl=70, pr=20, pt=20, pb=40, xmax=Math.max(R.rec,R.pe)*1.25, cvp=R.rec?R.cv/R.rec:0;
  const ymax=Math.max(xmax, R.cf+xmax*cvp), X=v=>pl+(W-pl-pr)*v/xmax, Y=v=>H-pb-(H-pt-pb)*v/ymax;
  const passo=m=>{ const r=m/5, q=Math.pow(10,Math.floor(Math.log10(r))), n=r/q; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*q; };
  const st=passo(ymax), gy=[]; for(let v=0; v<=ymax+1e-9; v+=st) gy.push(v);
  const sx=passo(xmax), gx=[]; for(let v=0; v<=xmax+1e-9; v+=sx) gx.push(v);
  return `<div class="card"><div class="card-h"><h2 style="font-size:17px">Gráfico do ponto de equilíbrio</h2>
    <div class="legend"><span><i style="background:var(--bar-a)"></i>Faturamento</span><span><i style="background:var(--neg)"></i>Custo total (fixo + variável)</span><span><i style="background:var(--bar-b)"></i>Custo fixo</span></div></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ponto de equilíbrio em ${brl(R.pe)}">
    ${gy.map(v=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end">${abrev(v)}</text>`).join('')}
    ${gx.map(v=>`<text x="${X(v)}" y="${H-pb+18}" text-anchor="middle">${abrev(v)}</text>`).join('')}

/* ======================= CUSTEIO POR SETOR (custo hora) ======================= */
/* Custos fixos do ERP (classificações tratadas como fixas no ponto de equilíbrio), rateados entre os dois setores e divididos pelas horas de trabalho. */
const CU_DEF={base:'erp', fixoInf:0, rateio:'manual', pctA:56.11, dias:22, horas:8.5, pesA:1, pesB:1, prod:100, lucro:15, mcBase:'erp', varInf:40};
const CU_FOLGA=0.05; /* margem mínima que precisa sobrar para cobrir o fixo (5% do preço) */
const CU_SET=[{k:'A', nome:'Funilaria e pintura', rec:/PREPAR/, sub:'receita: Preparação'},{k:'B', nome:'Acabamento', rec:/ACABAM/, sub:'receita: Acabamento'}];
F.cuAno=new Date().getFullYear(); F.cuP=Object.assign(novoPer(),{tipo:'mes'}); F.cuPasso=false;
function cuCfg(){ return Object.assign({},CU_DEF,S.cfg.custeio||{}); }
function receitaSetores(ano,m0,m1){ const V=valoresPorConta(ano,'comp'), out={A:0,B:0};
  gruposDe('receita').forEach(g=>g.contas.forEach(c=>{ let v=0; for(let i=m0;i<=m1;i++) v+=(V[c.id]||[])[i]||0; const n=norm(c.nome); CU_SET.forEach(s=>{ if(s.rec.test(n)) out[s.k]+=v; }); })); return out; }
function calcCusteio(){
  const C=cuCfg(), ano=F.cuAno, [m0,m1]=faixa(F.cuP), R=calcPE(ano,m0,m1), T=R.T;
  const meses=Math.max(1,R.nMov), fixoERP=R.cf/meses, fixo=C.base==='inf'?parseNum(C.fixoInf):fixoERP;
  const rec=receitaSetores(ano,m0,m1), recT=rec.A+rec.B;
  const ratFat=C.rateio==='fat'&&rec.A>0&&rec.B>0, ratAviso=C.rateio==='fat'&&!ratFat; let pA=ratFat? rec.A/recT : parseNum(C.pctA)/100; pA=Math.min(1,Math.max(0,pA));
  const pct={A:pA,B:1-pA}, mcERP=R.mcp, mc=C.mcBase==='inf'?1-Math.min(100,Math.max(0,parseNum(C.varInf)))/100:R.mcp, lucro=parseNum(C.lucro)/100, prod=Math.min(100,Math.max(1,parseNum(C.prod)))/100;
  const hMes=parseNum(C.dias)*parseNum(C.horas);
  const set=CU_SET.map(s=>{ const pes=Math.max(1,parseNum(C['pes'+s.k])||1), cf=fixo*pct[s.k], hDisp=hMes*pes, hProd=hDisp*prod, ch=hProd?cf/hProd:0;
    const precoMin=mc>0?ch/mc:null, precoLucro=mc-lucro>=CU_FOLGA?ch/(mc-lucro):null, recM=rec[s.k]/meses;
    return Object.assign({},s,{pes, pct:pct[s.k], cf, hDisp, hProd, ch, chPessoa:ch, precoMin, precoLucro, rec:recM, cob:cf?recM*Math.max(0,mc)/cf:null}); });
  return {C, R, T, mcERP, ratAviso, inviavel:mc-lucro<CU_FOLGA, ano, m0, m1, meses, fixo, fixoERP, hMes, prod, mc, lucro, set, rotulo:rotuloPer(F.cuP,ano)};
}

        <span class="hint">${s.rec?`a margem desse faturamento cobre <b>${pct(s.cob)}</b> do custo fixo do setor`:'sem faturamento lançado no período'}</span>`:''}</div>
    </div>`).join('');
  const passo=X.set.map(s=>`<li><b>${esc(s.nome)}:</b> ${brl(X.fixo)} × ${pct(s.pct)} = <b>${brl(s.cf)}</b> → ${brl(s.cf)} ÷ ${fnum(s.hProd,1)} h${s.pes>1||X.prod<1?` <span class="hint">(${fnum(parseNum(C.dias),1)} dias × ${fnum(parseNum(C.horas),2)} h${s.pes>1?' × '+s.pes+' pessoas':''}${X.prod<1?' × '+pct(X.prod):''})</span>`:` <span class="hint">(${fnum(parseNum(C.dias),1)} dias × ${fnum(parseNum(C.horas),2)} h)</span>`} = <b>${brl(s.ch)}/h</b>${s.precoMin?` → ÷ margem de contribuição ${pct(X.mc)} = <b>${brl(s.precoMin)}/h</b> mínimo`:''}</li>`).join('');
  return `<div class="bar"><div class="row">${anoSelect('cuAnoSel',X.ano,'cuAno')}${periodoUI('cuP')}</div>${botoesExp('custeio')}</div>

    </div>
    <div class="cu-par-row">
      <div class="rp-dt cu-grp"><span class="rp-dl">Horas</span>${num('dias','Dias no mês','dias',105)}${num('horas','Horas por dia','h',105)}${num('prod','Produtividade','%',105)}</div>
      <div class="rp-dt cu-grp"><span class="rp-dl">Pessoas</span>${num('pesA','Funilaria e pintura','',120)}${num('pesB','Acabamento','',105)}</div>

        ${C.rateio==='manual'||X.ratAviso?num('pctA','Funilaria e pintura','%',120)+`<div class="f" style="flex:0 1 105px"><label>Acabamento</label><div class="cu-ro">${fnum(100-parseNum(C.pctA),2)} %</div></div>`:`<span class="hint" style="align-self:center">${X.set.map(s=>esc(s.nome)+' '+fnum(s.pct*100,2)+'%').join(' · ')}</span>`}</div>
      <div class="rp-dt cu-grp"><span class="rp-dl">Preço</span><div class="f"><label>Custos variáveis</label><div class="chips" role="group" aria-label="Custos variáveis"><button type="button" data-act="cuMc" data-v="erp" aria-pressed="${C.mcBase!=='inf'}">Do ERP</button><button type="button" data-act="cuMc" data-v="inf" aria-pressed="${C.mcBase==='inf'}">Informar %</button></div></div>
        ${C.mcBase==='inf'?num('varInf','% do faturamento','%',120):`<div class="f" style="flex:0 1 auto"><label>% do faturamento</label><div class="cu-ro">${pct(1-X.mcERP)}</div></div>`}
        <div class="f" style="flex:0 1 auto"><label>Margem de contribuição</label><div class="cu-ro" style="color:var(--accent);border-color:var(--accent)">${pct(X.mc)}</div></div>

  ${X.inviavel&&!semFixo?`<div class="warnbox">Com custos variáveis de <b>${pct(1-X.mc)}</b> do faturamento, a margem de contribuição é <b>${pct(X.mc)}</b>. O lucro desejado (<b>${pct(X.lucro)}</b>) precisa ser menor que ela, deixando pelo menos ${pct(CU_FOLGA)} para cobrir o custo fixo. Reduza o lucro desejado ou revise os custos variáveis${X.C.mcBase!=='inf'?' (num mês com pouco faturamento lançado, o % de variáveis do ERP pode estar distorcido; use "Informar %")':''}.</div>`:''}
  ${semFixo?`<div class="warnbox">Não há custos fixos ${C.base==='inf'?'informados':'lançados em '+esc(X.rotulo)}. ${C.base==='inf'?'Informe o valor do custo fixo mensal.':'Lance as despesas fixas em Contas a pagar ou use "Informar valor" para simular.'}</div>`:''}
  <div class="cu-grid">${cards}</div>

    • <b>Preço mínimo da hora</b> = custo fixo por hora ÷ margem de contribuição (${pct(X.mc)}, do ponto de equilíbrio). Cobre o fixo e os custos variáveis, impostos e taxas de cada serviço.<br>
    • <b>Preço com lucro</b> = custo fixo por hora ÷ (margem de contribuição − lucro desejado). Exemplo: margem 60% e lucro 15% → divide por 45%. Se o lucro chegar perto da margem, o divisor vai a zero e o preço explode; por isso o ERP marca como inviável.<br>

/* Preço do setor = (valor da hora × horas + material) × multiplicador. Aprovado vira conta a receber por setor. */
const ORC_SET=[{k:'prep', nome:'Preparação', rec:/PREPAR/},{k:'acab', nome:'Acabamento', rec:/ACABAM/}];
const ORC_DEF={prep:{hora:37, qt:8, mat:680, mult:2.5}, acab:{hora:44, qt:8, mat:542, mult:2.5}};
const ORC_ST={aberto:'Em aberto', aprovado:'Aprovado', recusado:'Recusado'};
F.orcQ=''; F.orcSt='todos';
const orcPadrao=()=>Object.assign({}, ORC_DEF, (S.cfg.orcPadrao||{}));
function orcCalc(o){ const r={}; let total=0; ORC_SET.forEach(s=>{ const x=o.setores[s.k]||{}; const mo=(+x.hora||0)*(+x.qt||0), custo=mo+(+x.mat||0), preco=Math.round(custo*(+x.mult||0)*100)/100; r[s.k]={mo, custo, preco}; total+=preco; }); r.total=Math.round(total*100)/100; return r; }
function contaReceita(re){ for(const g of gruposDe('receita')) for(const c of g.contas){ if(c.ativo!==false && re.test(norm(c.nome))) return c.id; } return ''; }

const ORC_INICIO=2051; /* primeiro número da sequência */

F.orcEd=null; F.orcAnt=false; F.orcSalvo='';
const orcSnap=O=>JSON.stringify([O.numero,O.data,O.cliente,O.veiculo,O.obs,O.setores]);
